compute_lighting_groups:
  name: Compute lighting groups
  description: >-
    Works out the minimal set of light.turn_on/light.turn_off calls
    needed to reach a target brightness/colour temperature: filters out
    unreachable lights, groups by multiplier, skips anything already
    within tolerance, leaves overridden lights alone, and
    separates out lights needing a two-step transition. Read-only - it
    reports what it would do without touching anything.
    Standalone; doesn't require this repo's blueprint.
  fields:
    entities:
      name: Entities
      description: Light entities to consider.
      required: true
      selector:
        entity:
          multiple: true
          domain: light
    brightness_multipliers:
      name: Brightness multipliers
      description: >-
        Map of entity_id to multiplier. 0 turns that light off; other
        numbers scale brightness, clamped to 1-255 (so a value above 1
        just means "as bright as it goes"); null/false skips the light
        entirely (excluded from every group). Entities not listed
        default to a multiplier of 1.
      example: '{"light.lamp": 0.5, "light.strip": 0}'
      selector:
        object:
    brightness:
      name: Target brightness
      description: Base brightness (0-255) before multipliers are applied.
      required: true
      selector:
        number:
          min: 0
          max: 255
    color_temp_kelvin:
      name: Target colour temperature
      description: Target colour temperature in Kelvin.
      required: true
      selector:
        number:
          min: 1000
          max: 10000
          unit_of_measurement: K
    brightness_tolerance:
      name: Brightness tolerance
      description: >-
        A light already within this many brightness points of the target
        is left alone instead of being recommanded.
      default: 2
      selector:
        number:
          min: 0
          max: 50
    color_temp_tolerance:
      name: Colour temperature tolerance
      description: >-
        A light already within this many Kelvin of the target is left
        alone instead of being recommanded. A colour temperature that's
        identical once converted to mireds (the unit real devices
        actually use) always counts as a match regardless of this
        setting, even if the Kelvin gap exceeds it.
      default: 10
      selector:
        number:
          min: 0
          max: 500
          unit_of_measurement: K
    two_step_label:
      name: Two-step label
      description: >-
        Entities or devices carrying this label are returned separately
        (as "two_step") so you can send brightness and colour temperature
        as two sequential calls instead of one combined call - for bulbs
        that can't transition both together.
      default: no_combined_transition
      selector:
        text:
    prefer_rgb_color:
      name: Prefer RGB colour
      description: >-
        When true (and rgb_color is given), entities whose
        supported_color_modes indicates RGB support are returned
        separately (as "combined_rgb"/"two_step_rgb") targeting rgb_color
        instead of "combined"/"two_step" targeting
        color_temp_kelvin. Entities without RGB support are
        unaffected either way. Off by default - behaviour is identical to
        before this field existed.
      default: false
      selector:
        boolean:
    rgb_color:
      name: Target RGB colour
      description: >-
        The RGB colour to use for RGB-capable entities when
        prefer_rgb_color is true. Typically the Kelvin -> RGB conversion
        of the same target colour temperature (see compute_curve's own
        rgb_color output). Leave unset (or pass null explicitly - useful
        when templating this from a source that may not always have one)
        if you're not using prefer_rgb_color.
      selector:
        color_rgb:
    rgb_color_tolerance:
      name: RGB colour tolerance
      description: >-
        A light already within this many points (0-255 scale, per
        channel) of the target rgb_color is left alone instead of being
        recommanded.
      default: 10
      selector:
        number:
          min: 0
          max: 100
    force:
      name: Force
      description: >-
        Bypasses override protection for this call, writing every
        entity even if something else currently holds it. The write is
        still recorded, so a later non-forced call recognises it and
        protection works again afterward. Off by default.
      default: false
      selector:
        boolean:
    tracking_device_id:
      name: Tracking scope
      description: >-
        The FLARE state device (Settings -> Devices & Services -> FLARE
        Tracking) whose claims decide what's already externally-set.
        Leave unset and nothing is treated as externally-set - every
        entity is planned as though free to manage.
      selector:
        device:
          filter:
            - integration: flare
              model: Tracking Scope

apply_lighting:
  name: Apply adaptive lighting
  description: >-
    Given a target brightness/colour-temperature (and optionally RGB
    colour), actually turns entities on/off via light.turn_on/
    light.turn_off - the same reachability/tolerance/override-protection/
    two-step/RGB-vs-colour-temp logic compute_lighting_groups exposes as
    data, but dispatched for you. Takes the same brightness/
    color_temp_kelvin/rgb_color fields compute_lighting_groups does - if
    you're feeding these from a sensor entity's attributes yourself (e.g.
    the FLARE blueprint in this repo, reading its own FLARE Sensor
    input), that's just an ordinary template on the caller's side; this
    service itself doesn't read any entity. Standalone - call this from
    your own automation, it doesn't require the FLARE blueprint.
  fields:
    entities:
      name: Entities
      description: Light entities to consider.
      required: true
      selector:
        entity:
          multiple: true
          domain: light
    brightness_multipliers:
      name: Brightness multipliers
      description: >-
        Map of entity_id to multiplier. 0 turns that light off; other
        numbers scale brightness, clamped to 1-255 (so a value above 1
        just means "as bright as it goes"); null/false skips the light
        entirely (excluded from every group). Entities not listed
        default to a multiplier of 1.
      example: '{"light.lamp": 0.5, "light.strip": 0}'
      selector:
        object:
    brightness:
      name: Target brightness
      description: Base brightness (0-255) before multipliers are applied.
      required: true
      selector:
        number:
          min: 0
          max: 255
    color_temp_kelvin:
      name: Target colour temperature
      description: Target colour temperature in Kelvin.
      required: true
      selector:
        number:
          min: 1000
          max: 10000
          unit_of_measurement: K
    transition:
      name: Transition
      description: >-
        Transition duration in seconds. Two-step entities get this
        halved, applied twice (brightness, then colour).
      required: true
      selector:
        number:
          min: 0
          max: 300
          unit_of_measurement: s
    brightness_tolerance:
      name: Brightness tolerance
      description: >-
        A light already within this many brightness points of the target
        is left alone instead of being recommanded.
      default: 2
      selector:
        number:
          min: 0
          max: 50
    color_temp_tolerance:
      name: Colour temperature tolerance
      description: >-
        A light already within this many Kelvin of the target is left
        alone instead of being recommanded. A colour temperature that's
        identical once converted to mireds (the unit real devices
        actually use) always counts as a match regardless of this
        setting, even if the Kelvin gap exceeds it.
      default: 10
      selector:
        number:
          min: 0
          max: 500
          unit_of_measurement: K
    two_step_label:
      name: Two-step label
      description: >-
        Entities or devices carrying this label get brightness and
        colour temperature sent as two sequential calls instead of one
        combined call - for bulbs that can't transition both together.
      default: no_combined_transition
      selector:
        text:
    prefer_rgb_color:
      name: Prefer RGB colour
      description: >-
        When true (and rgb_color is given), entities whose
        supported_color_modes indicates RGB support get rgb_color
        instead of color_temp_kelvin. Entities without RGB support are
        unaffected either way. Off by default.
      default: false
      selector:
        boolean:
    rgb_color:
      name: Target RGB colour
      description: >-
        The RGB colour to use for RGB-capable entities when
        prefer_rgb_color is true. Typically the Kelvin -> RGB conversion
        of the same target colour temperature (see compute_curve's own
        rgb_color output). Leave unset (or pass null explicitly - useful
        when templating this from a source that may not always have one)
        if you're not using prefer_rgb_color.
      selector:
        color_rgb:
    rgb_color_tolerance:
      name: RGB colour tolerance
      description: >-
        A light already within this many points (0-255 scale, per
        channel) of the target rgb_color is left alone instead of being
        recommanded.
      default: 10
      selector:
        number:
          min: 0
          max: 100
    force:
      name: Force
      description: >-
        Bypasses override protection for this call, writing every
        entity even if something else currently holds it. The write is
        still recorded, so a later non-forced call recognises it and
        protection works again afterward. Off by default.
      default: false
      selector:
        boolean:
    tracking_device_id:
      name: Tracking scope
      description: >-
        The FLARE state device (Settings -> Devices & Services -> FLARE
        Tracking) this write belongs to. Leave unset to write the
        light(s) without tracking them at all - no claim is recorded,
        so nothing is protected on a later call.
      selector:
        device:
          filter:
            - integration: flare
              model: Tracking Scope

compute_curve:
  name: Compute adaptive curve point
  description: >-
    Given today's morning/day/evening/night phase-boundary timestamps,
    returns the target brightness, colour temperature, RGB colour, and
    phase name for a given instant (or now, if not specified). Standalone
    - useful for building your own day-phase sensor or automation without
    the FLARE blueprint.
  fields:
    morning:
      name: Morning boundary
      description: Unix timestamp when the Morning phase starts today.
      required: true
      selector:
        number:
    day:
      name: Day boundary
      description: Unix timestamp when the Day phase starts today.
      required: true
      selector:
        number:
    evening:
      name: Evening boundary
      description: Unix timestamp when the Evening phase starts today.
      required: true
      selector:
        number:
    night:
      name: Night boundary
      description: Unix timestamp when the Night phase starts today.
      required: true
      selector:
        number:
    at:
      name: At
      description: Instant to evaluate, as a unix timestamp. Defaults to now.
      selector:
        number:
    morning_brightness:
      name: Morning brightness
      description: Brightness (0-255) for Morning.
      default: 255
      selector:
        number:
          min: 0
          max: 255
    morning_kelvin:
      name: Morning colour temperature
      description: Colour temperature (Kelvin) for Morning, and where Day's ramp starts from.
      default: 6667
      selector:
        number:
          min: 1000
          max: 10000
          unit_of_measurement: K
    day_brightness:
      name: Day brightness
      description: Brightness (0-255) for Day.
      default: 255
      selector:
        number:
          min: 0
          max: 255
    day_kelvin:
      name: Day colour temperature
      description: >-
        Colour temperature (Kelvin) for Day. Defaults to Morning's, since
        Day's default transition covers the whole phase - so Day starts at
        Morning's colour and eases to Evening's across the afternoon.
      default: 6667
      selector:
        number:
          min: 1000
          max: 10000
          unit_of_measurement: K
    evening_brightness:
      name: Evening brightness
      description: Brightness (0-255) Evening holds at before its fade into Night.
      default: 180
      selector:
        number:
          min: 0
          max: 255
    evening_kelvin:
      name: Evening colour temperature
      description: Colour temperature (Kelvin) Evening holds at before its final-hour fade.
      default: 3200
      selector:
        number:
          min: 1000
          max: 10000
          unit_of_measurement: K
    night_brightness:
      name: Night brightness
      description: Brightness (0-255) for Night, and what Evening's final hour fades toward.
      default: 80
      selector:
        number:
          min: 0
          max: 255
    night_kelvin:
      name: Night colour temperature
      description: Colour temperature (Kelvin) for Night, and what Evening's final hour fades toward.
      default: 2700
      selector:
        number:
          min: 1000
          max: 10000
          unit_of_measurement: K
    morning_brightness_transition:
      name: Morning brightness transition
      description: >-
        Minutes before Morning ends to begin easing
        brightness toward the next
        phase's, so it arrives exactly as that phase begins. 0 is a hard
        cut. A value longer than Morning lasts covers the whole phase.
      default: 60
      selector:
        number:
          min: 0
          max: 1440
          unit_of_measurement: min
    morning_kelvin_transition:
      name: Morning colour transition
      description: >-
        Minutes before Morning ends to begin easing
        colour temperature toward the next
        phase's, so it arrives exactly as that phase begins. 0 is a hard
        cut. A value longer than Morning lasts covers the whole phase.
      default: 60
      selector:
        number:
          min: 0
          max: 1440
          unit_of_measurement: min
    day_brightness_transition:
      name: Day brightness transition
      description: >-
        Minutes before Day ends to begin easing
        brightness toward the next
        phase's, so it arrives exactly as that phase begins. 0 is a hard
        cut. A value longer than Day lasts covers the whole phase.
      default: 65
      selector:
        number:
          min: 0
          max: 1440
          unit_of_measurement: min
    day_kelvin_transition:
      name: Day colour transition
      description: >-
        Minutes before Day ends to begin easing
        colour temperature toward the next
        phase's, so it arrives exactly as that phase begins. 0 is a hard
        cut. A value longer than Day lasts covers the whole phase.
      default: 1440
      selector:
        number:
          min: 0
          max: 1440
          unit_of_measurement: min
    evening_brightness_transition:
      name: Evening brightness transition
      description: >-
        Minutes before Evening ends to begin easing
        brightness toward the next
        phase's, so it arrives exactly as that phase begins. 0 is a hard
        cut. A value longer than Evening lasts covers the whole phase.
      default: 60
      selector:
        number:
          min: 0
          max: 1440
          unit_of_measurement: min
    evening_kelvin_transition:
      name: Evening colour transition
      description: >-
        Minutes before Evening ends to begin easing
        colour temperature toward the next
        phase's, so it arrives exactly as that phase begins. 0 is a hard
        cut. A value longer than Evening lasts covers the whole phase.
      default: 60
      selector:
        number:
          min: 0
          max: 1440
          unit_of_measurement: min
    night_brightness_transition:
      name: Night brightness transition
      description: >-
        Minutes before Night ends to begin easing
        brightness toward the next
        phase's, so it arrives exactly as that phase begins. 0 is a hard
        cut. A value longer than Night lasts covers the whole phase.
      default: 30
      selector:
        number:
          min: 0
          max: 1440
          unit_of_measurement: min
    night_kelvin_transition:
      name: Night colour transition
      description: >-
        Minutes before Night ends to begin easing
        colour temperature toward the next
        phase's, so it arrives exactly as that phase begins. 0 is a hard
        cut. A value longer than Night lasts covers the whole phase.
      default: 30
      selector:
        number:
          min: 0
          max: 1440
          unit_of_measurement: min

compute_scene_coverage:
  name: Compute scene coverage
  description: >-
    Given a candidate scene and the entities you want a "default"
    behaviour applied to, works out which of those entities the scene
    actually covers - hand covered ones to the scene and apply your
    default (adaptive lighting, or anything else) only to what's left.
    A scene only counts if it exists and everything it covers is within
    scope_entities; a scene reaching outside that scope, or one that
    doesn't exist (a typo, a renamed scene), is treated the same as no
    scene at all. Standalone - nothing here is specific to adaptive
    lighting, or even to lighting.
  fields:
    scene_entity_id:
      name: Scene
      description: >-
        The scene to check. If you don't have a candidate scene this
        tick (no scene template, no per-phase scene for the current
        phase), skip calling this service entirely - every target
        entity is uncovered either way, so there's nothing to ask.
      required: true
      selector:
        entity:
          domain: scene
    scope_entities:
      name: Scope entities
      description: >-
        Every entity the scene is allowed to touch - typically the
        entities you're controlling, plus sibling entities on the same
        devices (e.g. a light strip's effect selector). A scene
        covering anything outside this list is treated as invalid.
      required: true
      selector:
        entity:
          multiple: true
    target_entities:
      name: Target entities
      description: >-
        The entities you want a default behaviour applied to - the
        response's uncovered_entities is this list minus whatever the
        scene covers.
      required: true
      selector:
        entity:
          multiple: true

check_control:
  name: Check control
  description: >-
    For each entity, reports whether adaptive lighting is currently in
    control of it, and whether a write should be blocked - the exact
    override-protection mechanism apply_lighting/compute_lighting_groups
    use internally, exposed standalone so any automation can ask "should
    I write this" without any of this integration's brightness/curve
    logic at all. Read-only - call record_write afterwards if you do
    write the entity, so a later check recognises that write.

    Checks against tracking_device_id's own claims. This service exists
    only to answer questions about tracking, so unlike apply_lighting
    there's nothing useful to do without one - it's required. The
    response's "scope" field simply echoes tracking_device_id's own title
    back.
  fields:
    entities:
      name: Entities
      description: Entities to check. Any domain - this mechanism isn't light-specific.
      required: true
      selector:
        entity:
          multiple: true
    tracking_device_id:
      name: Tracking scope
      description: >-
        The FLARE state device (Settings -> Devices & Services -> FLARE
        Tracking) to check these entities' claims against.
      required: true
      selector:
        device:
          filter:
            - integration: flare
              model: Tracking Scope
    brightness_tolerance:
      name: Brightness tolerance
      description: >-
        Used only for the delayed-echo rescue: a light whose current
        brightness is within this many points of what a still-unconfirmed
        write asked for is treated as that write's own echo, not an
        external change.
      default: 2
      selector:
        number:
          min: 0
          max: 50
    color_temp_tolerance:
      name: Colour temperature tolerance
      description: >-
        Same rescue, for colour temperature (Kelvin) - plus, always, a
        colour temperature that's identical once converted to mireds
        (the unit real devices actually use), regardless of this
        setting.
      default: 10
      selector:
        number:
          min: 0
          max: 500
          unit_of_measurement: K
    rgb_color_tolerance:
      name: RGB colour tolerance
      description: Same rescue, for RGB colour (0-255 scale, per channel).
      default: 10
      selector:
        number:
          min: 0
          max: 100

record_write:
  name: Record write
  description: >-
    Records that this call's own context just wrote entities - call it
    immediately after actually issuing whatever write check_control said
    was allowed, so a later check recognises that write rather than
    reading it as an external change. A thin wrapper around the same
    bookkeeping apply_lighting uses internally.

    This service exists only to write tracking claims, so unlike
    apply_lighting there's nothing useful to do without a scope - it's
    required.
  fields:
    entities:
      name: Entities
      description: Entities that were actually written.
      required: true
      selector:
        entity:
          multiple: true
    tracking_device_id:
      name: Tracking scope
      description: >-
        The FLARE state device (Settings -> Devices & Services -> FLARE
        Tracking) to record this write into.
      required: true
      selector:
        device:
          filter:
            - integration: flare
              model: Tracking Scope
    targets:
      name: Targets
      description: >-
        Map of entity_id to what that write actually asked for -
        {"brightness": ..., "color_temp_kelvin": ...} or {"brightness":
        ..., "rgb_color": [...]}. Optional, but needed for
        check_control's delayed-echo rescue to work for these entities
        later - without it, a context.id mismatch alone is always treated
        as external.
      example: '{"light.lamp": {"brightness": 200, "color_temp_kelvin": 3000}}'
      selector:
        object:

clear_claims:
  name: Clear claims
  description: >-
    Discards entities' tracked observed/latest claims within
    tracking_device_id - the manual escape hatch for an entity stuck
    reporting as overridden with no other way back (a claim can go
    permanently stale for an entity that's excluded from every future
    write once overridden, since nothing ever gets the chance to record
    a fresh one - see the integration reference's "Override protection"
    section). The next write to a cleared entity, from anyone, is
    treated exactly like a brand-new entity's first write.

    This service exists only to discard tracking claims, so unlike
    apply_lighting there's nothing useful to do without a scope - it's
    required.
  fields:
    entities:
      name: Entities
      description: Entities to clear tracked claims for. Any domain.
      required: true
      selector:
        entity:
          multiple: true
    tracking_device_id:
      name: Tracking scope
      description: >-
        The FLARE state device (Settings -> Devices & Services -> FLARE
        Tracking) to clear these entities' claims from.
      required: true
      selector:
        device:
          filter:
            - integration: flare
              model: Tracking Scope
