compute_lighting_groups:
  name: Compute lighting groups
  description: >-
    Given a set of light entities, a target brightness/colour-temperature,
    and optional per-light brightness multipliers, works out the minimal
    set of light.turn_on/light.turn_off calls actually needed: filters out
    unreachable lights, groups by multiplier, skips anything already
    within tolerance of the target, leaves externally-set lights alone
    (a light whose current context.id doesn't match what this
    integration itself last wrote it with under the same owner_id - a
    person, another automation, a device regaining power, or a
    different owner_id entirely - see that field's own description),
    and separates out lights that need a two-step (brightness-then-
    colour) transition.
    Standalone - call this from your own automation, it doesn't require
    the adaptive_lighting blueprint in this repo.
  fields:
    entities:
      name: Entities
      description: Light entities to consider.
      required: true
      selector:
        entity:
          multiple: true
          domain: light
    brightness_multipliers:
      name: Brightness multipliers
      description: >-
        Map of entity_id to multiplier. 0 turns that light off; other
        numbers scale brightness, clamped to 1-255 (so a value above 1
        just means "as bright as it goes"); null/false skips the light
        entirely (excluded from every group). Entities not listed
        default to a multiplier of 1.
      example: '{"light.lamp": 0.5, "light.strip": 0}'
      selector:
        object:
    sensor_brightness:
      name: Target brightness
      description: Base brightness (0-255) before multipliers are applied.
      required: true
      selector:
        number:
          min: 0
          max: 255
    sensor_color_temp_kelvin:
      name: Target colour temperature
      description: Target colour temperature in Kelvin.
      required: true
      selector:
        number:
          min: 1000
          max: 10000
          unit_of_measurement: K
    brightness_tolerance:
      name: Brightness tolerance
      description: >-
        A light already within this many brightness points of the target
        is left alone instead of being recommanded.
      default: 2
      selector:
        number:
          min: 0
          max: 50
    color_temp_tolerance:
      name: Colour temperature tolerance
      description: >-
        A light already within this many Kelvin of the target is left
        alone instead of being recommanded.
      default: 10
      selector:
        number:
          min: 0
          max: 500
          unit_of_measurement: K
    two_step_label:
      name: Two-step label
      description: >-
        Entities or devices carrying this label are returned separately
        (as "two_step") so you can send brightness and colour temperature
        as two sequential calls instead of one combined call - for bulbs
        that can't transition both together.
      default: no_combined_transition
      selector:
        text:
    prefer_rgb_color:
      name: Prefer RGB colour
      description: >-
        When true (and rgb_color is given), entities whose
        supported_color_modes indicates RGB support are returned
        separately (as "combined_rgb"/"two_step_rgb") targeting rgb_color
        instead of "combined"/"two_step" targeting
        sensor_color_temp_kelvin. Entities without RGB support are
        unaffected either way. Off by default - behaviour is identical to
        before this field existed.
      default: false
      selector:
        boolean:
    rgb_color:
      name: Target RGB colour
      description: >-
        The RGB colour to use for RGB-capable entities when
        prefer_rgb_color is true. Typically the Kelvin -> RGB conversion
        of the same target colour temperature (see compute_curve's own
        rgb_color output).
      selector:
        color_rgb:
    rgb_color_tolerance:
      name: RGB colour tolerance
      description: >-
        A light already within this many points (0-255 scale, per
        channel) of the target rgb_color is left alone instead of being
        recommanded.
      default: 10
      selector:
        number:
          min: 0
          max: 100
    owner_id:
      name: Owner ID
      description: >-
        Identifies this caller for externally-set protection - e.g. an
        automation passing its own {{ this.entity_id }}. Left unset, the
        check is skipped entirely (every light is treated as free to
        manage, regardless of what last touched it) - same as force
        below, but without claiming the write for a later call to
        recognise. Set it, and a light is left alone once anything other
        than a write recorded under this exact owner_id has touched it
        since - a person, another automation, a device regaining power,
        or an apply_lighting call using a different owner_id. A write
        recorded with no owner_id at all doesn't count against you -
        there was no claim to conflict with.
      selector:
        text:
    force:
      name: Force
      description: >-
        Bypasses externally-set protection outright for this call,
        regardless of owner_id. The write is still recorded under
        owner_id if one was given, so a later, non-forced call with that
        same owner_id correctly recognises it as its own rather than
        finding an orphaned record - the right way to force through and
        keep protection working normally afterward. Off by default.
      default: false
      selector:
        boolean:

apply_lighting:
  name: Apply adaptive lighting
  description: >-
    Reads brightness/colour temperature (and optionally RGB colour) off
    sensor_entity_id and actually turns entities on/off via
    light.turn_on/light.turn_off - the same reachability/tolerance/
    override-protection/two-step/RGB-vs-colour-temp logic
    compute_lighting_groups exposes as data, but dispatched for you.
    sensor_entity_id can be any sensor with brightness/color_temp
    attributes (optionally rgb_color too) - this integration's own
    sensor.adaptive_lighting works, but so does a hand-written template
    sensor (see README's "Bring your own sensor" section). Standalone -
    call this from your own automation, it doesn't require the
    adaptive_lighting blueprint in this repo.
  fields:
    entities:
      name: Entities
      description: Light entities to consider.
      required: true
      selector:
        entity:
          multiple: true
          domain: light
    brightness_multipliers:
      name: Brightness multipliers
      description: >-
        Map of entity_id to multiplier. 0 turns that light off; other
        numbers scale brightness, clamped to 1-255 (so a value above 1
        just means "as bright as it goes"); null/false skips the light
        entirely (excluded from every group). Entities not listed
        default to a multiplier of 1.
      example: '{"light.lamp": 0.5, "light.strip": 0}'
      selector:
        object:
    sensor_entity_id:
      name: Sensor
      description: >-
        The sensor to read brightness/color_temp/rgb_color attributes
        from - see README's "Bring your own sensor" section for the
        exact contract.
      required: true
      selector:
        entity:
          domain: sensor
    transition:
      name: Transition
      description: >-
        Transition duration in seconds. Two-step entities get this
        halved, applied twice (brightness, then colour).
      required: true
      selector:
        number:
          min: 0
          max: 300
          unit_of_measurement: s
    brightness_tolerance:
      name: Brightness tolerance
      description: >-
        A light already within this many brightness points of the target
        is left alone instead of being recommanded.
      default: 2
      selector:
        number:
          min: 0
          max: 50
    color_temp_tolerance:
      name: Colour temperature tolerance
      description: >-
        A light already within this many Kelvin of the target is left
        alone instead of being recommanded.
      default: 10
      selector:
        number:
          min: 0
          max: 500
          unit_of_measurement: K
    two_step_label:
      name: Two-step label
      description: >-
        Entities or devices carrying this label get brightness and
        colour temperature sent as two sequential calls instead of one
        combined call - for bulbs that can't transition both together.
      default: no_combined_transition
      selector:
        text:
    prefer_rgb_color:
      name: Prefer RGB colour
      description: >-
        When true, entities whose supported_color_modes indicates RGB
        support get the sensor's rgb_color attribute instead of
        color_temp_kelvin. Entities without RGB support, or used when the
        sensor has no rgb_color attribute, are unaffected. Off by
        default.
      default: false
      selector:
        boolean:
    rgb_color_tolerance:
      name: RGB colour tolerance
      description: >-
        A light already within this many points (0-255 scale, per
        channel) of the target rgb_color is left alone instead of being
        recommanded.
      default: 10
      selector:
        number:
          min: 0
          max: 100
    owner_id:
      name: Owner ID
      description: >-
        Identifies this caller for externally-set protection - e.g. an
        automation passing its own {{ this.entity_id }}. Left unset, the
        check is skipped entirely (every light is treated as free to
        manage, regardless of what last touched it) - same as force
        below, but without claiming the write for a later call to
        recognise. Set it, and a light is left alone once anything other
        than a write recorded under this exact owner_id has touched it
        since - a person, another automation, a device regaining power,
        or an apply_lighting call using a different owner_id. A write
        recorded with no owner_id at all doesn't count against you -
        there was no claim to conflict with.
      selector:
        text:
    force:
      name: Force
      description: >-
        Bypasses externally-set protection outright for this call,
        regardless of owner_id. The write is still recorded under
        owner_id if one was given, so a later, non-forced call with that
        same owner_id correctly recognises it as its own rather than
        finding an orphaned record - the right way to force through and
        keep protection working normally afterward. Off by default.
      default: false
      selector:
        boolean:

compute_curve:
  name: Compute adaptive curve point
  description: >-
    Given today's morning/day/evening/night phase-boundary timestamps,
    returns the target brightness, colour temperature, RGB colour, and
    phase name for a given instant (or now, if not specified). Standalone
    - useful for building your own day-phase sensor or automation without
    the adaptive_lighting blueprint.
  fields:
    morning:
      name: Morning boundary
      description: Unix timestamp when the Morning phase starts today.
      required: true
      selector:
        number:
    day:
      name: Day boundary
      description: Unix timestamp when the Day phase starts today.
      required: true
      selector:
        number:
    evening:
      name: Evening boundary
      description: Unix timestamp when the Evening phase starts today.
      required: true
      selector:
        number:
    night:
      name: Night boundary
      description: Unix timestamp when the Night phase starts today.
      required: true
      selector:
        number:
    at:
      name: At
      description: Instant to evaluate, as a unix timestamp. Defaults to now.
      selector:
        number:
    morning_brightness:
      name: Morning brightness
      description: Brightness (0-255) for Morning.
      default: 255
      selector:
        number:
          min: 0
          max: 255
    morning_kelvin:
      name: Morning colour temperature
      description: Colour temperature (Kelvin) for Morning, and where Day's ramp starts from.
      default: 6667
      selector:
        number:
          min: 1000
          max: 10000
          unit_of_measurement: K
    day_brightness:
      name: Day brightness
      description: Brightness (0-255) for Day.
      default: 255
      selector:
        number:
          min: 0
          max: 255
    day_end_kelvin:
      name: Day end colour temperature
      description: >-
        Colour temperature (Kelvin) Day ramps down to by the time Evening
        starts - also where Evening's own opening ramp starts from.
      default: 4000
      selector:
        number:
          min: 1000
          max: 10000
          unit_of_measurement: K
    evening_brightness:
      name: Evening brightness
      description: Brightness (0-255) Evening holds at before its final-hour fade.
      default: 180
      selector:
        number:
          min: 0
          max: 255
    evening_kelvin:
      name: Evening colour temperature
      description: Colour temperature (Kelvin) Evening holds at before its final-hour fade.
      default: 3200
      selector:
        number:
          min: 1000
          max: 10000
          unit_of_measurement: K
    night_brightness:
      name: Night brightness
      description: Brightness (0-255) for Night, and what Evening's final hour fades toward.
      default: 80
      selector:
        number:
          min: 0
          max: 255
    night_kelvin:
      name: Night colour temperature
      description: Colour temperature (Kelvin) for Night, and what Evening's final hour fades toward.
      default: 2700
      selector:
        number:
          min: 1000
          max: 10000
          unit_of_measurement: K

compute_scene_coverage:
  name: Compute scene coverage
  description: >-
    Given a candidate scene and the entities you want a "default"
    behaviour applied to, works out which of those entities the scene
    actually covers - hand covered ones to the scene and apply your
    default (adaptive lighting, or anything else) only to what's left.
    A scene only counts if it exists and everything it covers is within
    scope_entities; a scene reaching outside that scope, or one that
    doesn't exist (a typo, a renamed scene), is treated the same as no
    scene at all. Standalone - nothing here is specific to adaptive
    lighting, or even to lighting.
  fields:
    scene_entity_id:
      name: Scene
      description: >-
        The scene to check, if any. Leave blank to always get "no
        scene" behaviour (everything in target_entities comes back
        uncovered).
      selector:
        entity:
          domain: scene
    scope_entities:
      name: Scope entities
      description: >-
        Every entity the scene is allowed to touch - typically the
        entities you're controlling, plus sibling entities on the same
        devices (e.g. a light strip's effect selector). A scene
        covering anything outside this list is treated as invalid.
      required: true
      selector:
        entity:
          multiple: true
    target_entities:
      name: Target entities
      description: >-
        The entities you want a default behaviour applied to - the
        response's uncovered_entities is this list minus whatever the
        scene covers.
      required: true
      selector:
        entity:

check_ownership:
  name: Check ownership
  description: >-
    For each entity, decides whether a write should currently be blocked
    for owner_id - the exact override-protection mechanism
    apply_lighting/compute_lighting_groups use internally, exposed
    standalone so any automation can ask "should I write this" without
    any of this integration's brightness/curve logic at all. Read-only -
    call record_ownership afterward if you actually write the entity, so
    a later check_ownership call recognises it as yours.
  fields:
    entities:
      name: Entities
      description: Entities to check. Any domain - this mechanism isn't light-specific.
      required: true
      selector:
        entity:
          multiple: true
    owner_id:
      name: Owner ID
      description: >-
        Identifies this caller - e.g. an automation passing its own
        {{ this.entity_id }}. Left unset, every entity reports not
        blocked (the check is skipped entirely), same as force below,
        but without claiming anything for a later call to recognise.
      selector:
        text:
    force:
      name: Force
      description: >-
        Every entity reports not blocked, regardless of owner_id or any
        recorded claim. Off by default.
      default: false
      selector:
        boolean:
    brightness_tolerance:
      name: Brightness tolerance
      description: >-
        Used only for the delayed-echo rescue: a light whose current
        brightness is within this many points of what a still-unconfirmed
        write asked for is treated as that write's own echo, not an
        external change.
      default: 2
      selector:
        number:
          min: 0
          max: 50
    color_temp_tolerance:
      name: Colour temperature tolerance
      description: Same rescue, for colour temperature (Kelvin).
      default: 10
      selector:
        number:
          min: 0
          max: 500
          unit_of_measurement: K
    rgb_color_tolerance:
      name: RGB colour tolerance
      description: Same rescue, for RGB colour (0-255 scale, per channel).
      default: 10
      selector:
        number:
          min: 0
          max: 100

record_ownership:
  name: Record ownership
  description: >-
    Records that owner_id (this call's own context) just wrote entities -
    call this immediately after actually issuing whatever write
    check_ownership told you was allowed, so a later check_ownership call
    recognises it as yours. A thin wrapper around the same bookkeeping
    apply_lighting uses internally.
  fields:
    entities:
      name: Entities
      description: Entities that were actually written.
      required: true
      selector:
        entity:
          multiple: true
    owner_id:
      name: Owner ID
      description: >-
        Identifies this caller - e.g. an automation passing its own
        {{ this.entity_id }}. Left unset, the write is recorded with no
        owner (doesn't count against anyone later, but claims nothing
        either).
      selector:
        text:
    targets:
      name: Targets
      description: >-
        Map of entity_id to what that write actually asked for -
        {"brightness": ..., "color_temp_kelvin": ...} or {"brightness":
        ..., "rgb_color": [...]}. Optional, but needed for
        check_ownership's delayed-echo rescue to work for these entities
        later - without it, a context.id mismatch alone is always treated
        as external.
      example: '{"light.lamp": {"brightness": 200, "color_temp_kelvin": 3000}}'
      selector:
        object:
          multiple: true
