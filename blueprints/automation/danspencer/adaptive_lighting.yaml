blueprint:
  name: Adaptive Lighting
  description: >
    Adaptive lighting: sets brightness/colour temperature from a sensor,
    keeping lights updated as it changes, and turns them off a while
    after occupancy clears. Full details on every input:
    [docs/BLUEPRINT.md](https://github.com/danrspencer/adaptive_lighting/blob/main/docs/BLUEPRINT.md).
  domain: automation
  source_url: https://github.com/danrspencer/adaptive_lighting/blob/main/blueprints/automation/danspencer/adaptive_lighting.yaml
  author: Dan Spencer
  homeassistant:
    # Already required by the occupancy.* triggers/conditions below
    # (HA core-confirmed, see CLAUDE.md) - declared here for the first
    # time, prompted by the input sections below needing 2024.6.0, a
    # strictly lower floor than what this blueprint already assumed.
    min_version: 2026.4.0
  input:
    adaptive_sensor:
      name: Adaptive Lighting Sensor
      description: >
        Sensor providing brightness and colour temperature to apply -
        filtered to Adaptive Lighting Helpers' own sensors.
      selector:
        entity:
          filter:
            - integration: adaptive_lighting_helpers
              domain: sensor
    room_target:
      name: Lights & Occupancy
      description: >
        Entity, device, area, floor, or label - lights within it are
        controlled, occupancy-class sensors within it decide when.
        [Details](https://github.com/danrspencer/adaptive_lighting/blob/main/docs/BLUEPRINT.md#one-target-two-jobs).
      default: {}
      selector:
        target:
          entity:
            - domain: light
            - domain: binary_sensor
              device_class: occupancy
    extra_triggers:
      name: Additional Triggers (Optional)
      description: >
        Entities that trigger an immediate re-evaluation, e.g. a
        dependency of Scene Template or Brightness Multiplier Template.
        Only updates lights that are already on - never switches one on.
        [Details](https://github.com/danrspencer/adaptive_lighting/blob/main/docs/BLUEPRINT.md#additional-triggers).
      default: []
      selector:
        entity:
          multiple: true
    colour:
      name: Colour
      icon: mdi:palette
      collapsed: true
      input:
        rgb_phases:
          name: Prefer RGB During
          description: >
            Phases to send RGB colour instead of colour temperature
            during, for lights that support it (auto-detected). Colour
            reads as "relaxed/night" better than a plain colour-temperature
            warm white does, but isn't worth it for the rest of the day.
            [Details](https://github.com/danrspencer/adaptive_lighting/blob/main/docs/BLUEPRINT.md#rgb-colour).
          default: [Evening, Night]
          selector:
            select:
              options: [Morning, Day, Evening, Night]
              multiple: true
    scene_handoff:
      name: Scene Handoff
      icon: mdi:palette-swatch
      collapsed: true
      input:
        scene_template:
          name: Scene Template (Optional)
          description: >
            Template returning a scene entity_id to hand the room over
            to instead of the adaptive brightness/colour. Takes
            precedence over the per-phase scenes below whenever it
            returns one - they're the fallback for phases it doesn't
            cover.
            [Details](https://github.com/danrspencer/adaptive_lighting/blob/main/docs/BLUEPRINT.md#scene-handoff).
          default: ""
          selector:
            template: {}
        morning_scene:
          name: Morning Scene (Optional)
          default: null
          selector:
            entity:
              domain: scene
        day_scene:
          name: Day Scene (Optional)
          default: null
          selector:
            entity:
              domain: scene
        evening_scene:
          name: Evening Scene (Optional)
          default: null
          selector:
            entity:
              domain: scene
        night_scene:
          name: Night Scene (Optional)
          default: null
          selector:
            entity:
              domain: scene
    brightness_scaling:
      name: Brightness Scaling
      icon: mdi:brightness-percent
      collapsed: true
      input:
        brightness_multiplier_template:
          name: Brightness Multiplier Template (Optional)
          description: >
            Template returning entity_id → brightness multiplier (0 =
            off, null = skip entirely). Its own per-entity values always
            win over the per-phase exclusions below - those only fill in
            entities it doesn't already mention.
            [Details](https://github.com/danrspencer/adaptive_lighting/blob/main/docs/BLUEPRINT.md#per-light-brightness-scaling).
          default: "{{ {} }}"
          selector:
            template: {}
        morning_exclude_lights:
          name: Lights Off During Morning (Optional)
          selector:
            entity:
              domain: light
              multiple: true
          default: []
        day_exclude_lights:
          name: Lights Off During Day (Optional)
          selector:
            entity:
              domain: light
              multiple: true
          default: []
        evening_exclude_lights:
          name: Lights Off During Evening (Optional)
          selector:
            entity:
              domain: light
              multiple: true
          default: []
        night_exclude_lights:
          name: Lights Off During Night (Optional)
          selector:
            entity:
              domain: light
              multiple: true
          default: []
    timing:
      name: Timing
      icon: mdi:timer-outline
      collapsed: true
      input:
        no_motion_wait:
          name: Wait time
          description: Time to keep the light on after motion stops.
          default: 120
          selector:
            number:
              min: 0
              max: 3600
              unit_of_measurement: seconds
        reconcile_interval:
          name: Reconcile Interval (Optional)
          description: >
            How often to retry turning off lights left on with no occupancy.
            time_pattern syntax, e.g. '/5' for every 5 minutes.
          default: "/5"
          selector:
            text: {}
        motion_on_transition:
          name: Motion On Transition
          description: Transition duration when turning on via motion or a manual run.
          default: 1
          selector:
            number:
              min: 0
              max: 60
              unit_of_measurement: seconds
        motion_off_transition:
          name: Motion Off Transition
          description: Transition duration when turning off via motion.
          default: 15
          selector:
            number:
              min: 0
              max: 60
              unit_of_measurement: seconds
        adaptive_transition:
          name: Adaptive Transition
          description: Transition duration when adaptive lighting, the scene template, or an Additional Trigger updates.
          default: 30
          selector:
            number:
              min: 0
              max: 60
              unit_of_measurement: seconds

mode: restart
max_exceeded: silent

# Available to trigger definitions themselves (trigger: / condition:),
# unlike the variables: block below which isn't computed until after a
# trigger has fired - needed here so the `recovered` trigger's own
# template (which can't call a service, so can't reuse resolved_entities)
# can resolve room_target into light entities itself.
trigger_variables:
  room_target: !input room_target

trigger:
  # The live brightness/colour-temperature sensor; fires roughly once a
  # minute. With no to:/from:/attribute: filter, a state trigger fires on
  # attribute-only changes too - which is the usual case here, since the
  # sensor's state (the phase name) only changes four times a day while
  # its brightness/color_temp attributes tick every minute.
  - platform: state
    entity_id: !input adaptive_sensor
    id: adaptive
  # Anything named in Additional Triggers changed - e.g. a TV for a
  # brightness multiplier, or whatever the scene template depends on
  - id: extra
    platform: state
    entity_id: !input extra_triggers
  # Room's occupancy-class sensors (entity/device/area/floor/label)
  # just reported occupied - aggregates every matching occupancy sensor
  # automatically via Home Assistant's built-in Occupancy triggers. Left
  # unconditionally attached rather than disabled when Room has no
  # occupancy sensor in it - target is a required field for this trigger
  # type, but a target matching zero entities is a harmless no-op (see
  # CLAUDE.md for why this couldn't just be gated the way the old
  # separate Occupancy Sensor input was).
  - id: motion_on
    trigger: occupancy.detected
    target: !input room_target
  # Room's occupancy-class sensors have been continuously clear for no_motion_wait
  - id: motion_off
    trigger: occupancy.cleared
    target: !input room_target
    options:
      for:
        seconds: !input no_motion_wait
  # Periodic safety net - see the `reconcile` branch in action: below
  - id: reconcile
    platform: time_pattern
    minutes: !input reconcile_interval
  - id: recovered
    platform: template
    value_template: >
      {#
        Fires when one of our lights recovers from unavailable/unknown -
        a Zigbee mesh drop, or a physical power switch cutting and then
        restoring power to the room. Purely a promptness mechanism: it
        causes an ordinary tick to run right away, the same as any
        `extra` trigger firing, rather than waiting for the room's next
        unrelated tick (the periodic adaptive sensor tick, at most a
        minute or so) to notice. It carries no special handling of its
        own beyond that - no forced write, no scoped resync, no
        occupancy bypass. Whatever the recovered light's own current
        state is (on or off) just flows through the exact same
        adaptive_target_entities/allow_turn_on logic every other light
        in the room does: off stays off, on gets corrected.

        The reason this needs its own dedicated trigger at all, rather
        than "just let the next tick handle it": write_tracking.py
        (Adaptive Lighting Helpers) clears an entity's override-
        protection record the moment it's observed going unavailable -
        so by the time it reconnects there's no stale record for its
        fresh post-reconnect context.id to conflict with - but nothing
        makes that reconnect happen *promptly* on its own; this trigger
        is what closes that gap.

        IMPORTANT: this template can't reference `trigger.*` itself -
        confirmed against HA core's own template trigger source
        (homeassistant/components/template/trigger.py): the value_template
        that decides *whether to fire* is rendered with only this
        automation's trigger_variables in scope; `trigger` is only
        injected afterwards, into the fired action's own variables, from
        the real state_changed event that caused the render - a
        different pass entirely. An earlier version of this template did
        reference `trigger.entity_id`/`from_state`/`to_state` here, which
        meant `trigger is defined` was always false and this trigger
        could never fire at all - caught live when Living Room/Study
        never resynced after being power-cycled, despite the automation
        traces showing no `recovered`-triggered run at all. Fixed by
        testing an aggregate condition instead - "none of our lights are
        currently unavailable/unknown" - which edge-triggers (false to
        true) exactly when the last outstanding light recovers. This
        also correctly catches the common case of a single flaky bulb
        among several reliable ones: the aggregate is only ever false
        while *that* bulb is down (the others were never unavailable to
        begin with), so it fires the moment that one bulb - and only
        that one - clears, without needing per-entity information this
        template structurally can't have.
      #}
      {% set ns = namespace(entities=[]) %}
      {% if room_target is not none %}
        {% if room_target.entity_id is defined %}
          {% set eids = room_target.entity_id if room_target.entity_id is iterable and room_target.entity_id is not string else [room_target.entity_id] %}
          {% set ns.entities = ns.entities + (eids | select('match', '^light\.') | list) %}
        {% endif %}
        {% if room_target.device_id is defined %}
          {% set dids = room_target.device_id if room_target.device_id is iterable and room_target.device_id is not string else [room_target.device_id] %}
          {% for d in dids %}
            {% set ns.entities = ns.entities + (device_entities(d) | select('match', '^light\.') | list) %}
          {% endfor %}
        {% endif %}
        {% if room_target.area_id is defined %}
          {% set aids = room_target.area_id if room_target.area_id is iterable and room_target.area_id is not string else [room_target.area_id] %}
          {% for a in aids %}
            {% set ns.entities = ns.entities + (area_entities(a) | select('match', '^light\.') | list) %}
          {% endfor %}
        {% endif %}
      {% endif %}
      {% set light_entity_ids = ns.entities | unique | list %}
      {{ light_entity_ids | length > 0
         and light_entity_ids | select('is_state', 'unavailable') | list | length == 0
         and light_entity_ids | select('is_state', 'unknown') | list | length == 0 }}

condition:
  # Occupancy has exactly two jobs in this blueprint, and neither of
  # them is "should we update already-on lights" - see motion_off/
  # reconcile in action: below for the two places occupancy actually
  # gates anything (turning lights on via motion, and turning them off
  # once the room's confirmed empty). condition: itself no longer checks
  # occupancy at all: adaptive/extra/recovered always proceed (an
  # already-on light should track the curve regardless of who's in the
  # room right now - a room *with* a real occupancy sensor used to stop
  # updating on-lights the moment it read "unoccupied", while a room
  # with *no* sensor never had that restriction at all, since its own
  # "occupied" fallback is just "is anything already on" - inconsistent
  # for no real reason, removed); motion_on keeps its own efficiency
  # check (skip the call entirely if there's nothing to turn on), purely
  # to avoid a pointless apply_lighting round-trip, not a correctness
  # requirement - adaptive_target_entities/allow_turn_on below already
  # decide, correctly, whether anything's actually eligible to change.
  - or:
      - condition: not
        conditions:
          - condition: trigger
            id: motion_on
      - condition: and
        conditions:
          - condition: trigger
            id: motion_on
          - condition: template
            value_template: "{{ resolved_entities | map('states') | select('ne', 'on') | list | count > 0 }}"

variables:
  room_target: !input room_target
  adaptive_sensor: !input adaptive_sensor
  scene_template: !input scene_template
  adaptive_transition: !input adaptive_transition
  motion_on_transition: !input motion_on_transition
  rgb_phases: !input rgb_phases
  prefer_rgb_color: "{{ states(adaptive_sensor) in rgb_phases }}"
  script_transition: >
    {# Slow, smooth transition for adaptive/extra/recovered updates -
       none of these are a person waiting on a response in real time,
       so there's no reason to snap. Snappier for actual motion or a
       manual run instead. #}
    {% if trigger is defined and trigger.id is defined and trigger.id in ['adaptive', 'extra', 'recovered'] %}
      {{ adaptive_transition }}
    {% else %}
      {{ motion_on_transition }}
    {% endif %}
  # This run wasn't started by any of the triggers above at all - the
  # user hit "Run" on the automation itself, or called automation.trigger
  # directly. Used below to force this whole tick through regardless of
  # override protection, matching the same "I ran this on purpose, take
  # it back" intent a direct apply_lighting force call has. `trigger`
  # itself is still defined for a manual run (confirmed live - an
  # earlier `trigger is not defined` version of this check silently
  # never fired), it's `trigger.id` that isn't.
  manual_run: "{{ not (trigger is defined and trigger.id is defined) }}"
  # The brightness-multiplier chain is resolved up here, before
  # reachable_entities/entities_still_on below, because those two now
  # need hands_off_entities to build their turn-off lists. HA renders
  # variables: strictly top to bottom, each key only seeing the ones
  # declared above it, so this block cannot be moved back down.
  template_brightness_multipliers: !input brightness_multiplier_template
  morning_exclude_lights: !input morning_exclude_lights
  day_exclude_lights: !input day_exclude_lights
  evening_exclude_lights: !input evening_exclude_lights
  night_exclude_lights: !input night_exclude_lights
  phase_exclude_lights: >
    {% set m = {'Morning': morning_exclude_lights, 'Day': day_exclude_lights,
                'Evening': evening_exclude_lights, 'Night': night_exclude_lights} %}
    {{ m.get(states(adaptive_sensor), []) }}
  # The per-phase exclude list only fills in entities the template
  # doesn't already mention - its own per-entity values always win on
  # collision, so a room's existing template logic (e.g. dining_room_lighting's
  # illuminance-based override, unrelated to phase) can't be silently
  # discarded by also setting a phase exclusion.
  brightness_multipliers: >
    {% set ns = namespace(m={}) %}
    {% for e in phase_exclude_lights %}
      {% set ns.m = dict(ns.m, **{e: 0}) %}
    {% endfor %}
    {{ dict(ns.m, **template_brightness_multipliers) }}
  # Lights the multiplier template handed off entirely: a null/false
  # multiplier means "something else owns this, don't touch it", as
  # opposed to 0, which means "turn this one off". Those two must not be
  # conflated - and in Jinja, as in Python, `0 == false` is true, so an
  # `in [none, false]` membership test would wrongly swallow every 0 as
  # well. `is sameas false` is an identity check, mirroring exactly what
  # grouping.py's own `m is None or m is False` bucketing does.
  #
  # Used by the two turn-off paths below (motion_off and reconcile).
  # apply_lighting already skips these on its own, so a hands-off light
  # was never *dimmed* by this blueprint - but until this existed it was
  # still being switched off with the rest of the room, which made the
  # handoff only half-honoured. Caught live: a kitchen strip offloaded to
  # its own gradient automation was still being turned off on every
  # motion-clear and reconcile tick.
  hands_off_entities: >
    {% set ns = namespace(items=[]) %}
    {% for entity_id, multiplier in brightness_multipliers.items() %}
      {% if multiplier is none or multiplier is sameas false %}
        {% set ns.items = ns.items + [entity_id] %}
      {% endif %}
    {% endfor %}
    {{ ns.items }}
  # Brightness/colour temperature themselves are no longer extracted
  # here - adaptive_lighting_helpers.apply_lighting reads them straight
  # off adaptive_sensor (and applies rgb_color, tolerance-checking,
  # two-step transitions, etc.) rather than this blueprint pre-computing
  # sensor_brightness/sensor_color_temp_kelvin and dispatching itself.
  # (sensor_service/sensor_scene_id, a "sensor requests scene.apply"
  # passthrough, were removed here too - dead code: scene.apply's real
  # service schema only accepts entities/transition, not a scene_id
  # field, so that call never actually did anything.)
  # Every light this automation is allowed to touch, resolved from
  # room_target - filtered to ^light\. on every branch, since room_target
  # can also directly name occupancy-class sensor entities now
  resolved_entities: >
    {% set ns = namespace(entities=[]) %}
    {% if room_target is not none %}
      {% if room_target.entity_id is defined %}
        {% set eids = room_target.entity_id if room_target.entity_id is iterable and room_target.entity_id is not string else [room_target.entity_id] %}
        {% set ns.entities = ns.entities + (eids | select('match', '^light\.') | list) %}
      {% endif %}
      {% if room_target.device_id is defined %}
        {% set dids = room_target.device_id if room_target.device_id is iterable and room_target.device_id is not string else [room_target.device_id] %}
        {% for d in dids %}
          {% set ns.entities = ns.entities + (device_entities(d) | select('match', '^light\.') | list) %}
        {% endfor %}
      {% endif %}
      {% if room_target.area_id is defined %}
        {% set aids = room_target.area_id if room_target.area_id is iterable and room_target.area_id is not string else [room_target.area_id] %}
        {% for a in aids %}
          {% set ns.entities = ns.entities + (area_entities(a) | select('match', '^light\.') | list) %}
        {% endfor %}
      {% endif %}
    {% endif %}
    {{ ns.entities | unique | list }}
  # Entities HA already knows it can't reach right now - no point
  # commanding them - minus anything the multiplier template handed off
  # (see hands_off_entities above). Only feeds the motion_off turn-off.
  reachable_entities: >
    {{ resolved_entities | reject('is_state', 'unavailable') | reject('is_state', 'unknown')
       | reject('in', hands_off_entities) | list }}
  # room_target's occupancy-class binary_sensor entities (entity/device/
  # area only - floor/label aren't resolvable through this hand-rolled
  # Jinja the way they are through the native occupancy.* trigger/
  # condition, a pre-existing gap this shares with resolved_entities
  # above). Only used to decide *whether* Room has an occupancy sensor
  # at all, for the condition:/reconcile branches below - occupancy.is_detected
  # itself still does the real detection natively.
  room_occupancy_entities: >
    {% set ns = namespace(entities=[]) %}
    {% if room_target is not none %}
      {% if room_target.entity_id is defined %}
        {% set eids = room_target.entity_id if room_target.entity_id is iterable and room_target.entity_id is not string else [room_target.entity_id] %}
        {% set ns.entities = ns.entities + (eids | select('match', '^binary_sensor\.') | list) %}
      {% endif %}
      {% if room_target.device_id is defined %}
        {% set dids = room_target.device_id if room_target.device_id is iterable and room_target.device_id is not string else [room_target.device_id] %}
        {% for d in dids %}
          {% set ns.entities = ns.entities + (device_entities(d) | select('match', '^binary_sensor\.') | list) %}
        {% endfor %}
      {% endif %}
      {% if room_target.area_id is defined %}
        {% set aids = room_target.area_id if room_target.area_id is iterable and room_target.area_id is not string else [room_target.area_id] %}
        {% for a in aids %}
          {% set ns.entities = ns.entities + (area_entities(a) | select('match', '^binary_sensor\.') | list) %}
        {% endfor %}
      {% endif %}
    {% endif %}
    {{ ns.entities | select('is_state_attr', 'device_class', 'occupancy') | unique | list }}
  occupied: >
    {#
      Is the room "in use" right now - originally for the
      no-occupancy-sensor condition: branch only (see below), now also
      the "the room's clearly in use" half of allow_turn_on just below.
      Without a sensor, the only signal available is whether we've
      already turned something on - the same "a light being on doesn't
      really mean anyone's still there" imprecision the original bug
      this guard fixes was about, unavoidable without a real sensor.
    #}
    {{ resolved_entities | map('states') | select('eq', 'on') | list | count > 0 }}
  # Only three things may turn an off light on: motion actually
  # detecting someone, a deliberate manual run, or - the room already
  # being in active use (occupied: at least one of its lights is
  # already on). Everything else that reaches default: below (adaptive,
  # extra, recovered) may only ever update lights that are already on,
  # never switch a new one on. condition: doesn't gate any of these on
  # occupancy at all (see its own comment) - this is the only place that
  # actually decides it, for every trigger type uniformly, including
  # recovered: a light rejoining the network after a brief Zigbee/power
  # blip gets exactly the same treatment as any other light on any
  # other trigger - included if it's on, left alone if it's off. This
  # guard is what caught a real incident live: Jacob's only light, off
  # at bedtime, turned on from a network blip, before this existed
  # (grouping.py's tolerance/externally-set checks both explicitly
  # treat an off light as "not yet at target" and so include it for
  # turning on - correct for motion_on, wrong for everything else). The
  # `occupied` branch is what lets a *different* off light in an
  # already-in-use multi-light room still get switched on to match the
  # rest (e.g. a periodic tick topping up a room where one lamp's off
  # but others are already on) - room-level, not per-light.
  allow_turn_on: >
    {{ manual_run
       or (trigger is defined and trigger.id is defined and trigger.id == 'motion_on')
       or occupied }}
  # Used by the reconcile action branch below to retry turning off
  # anything still on - excluding handed-off lights (see
  # hands_off_entities above), which also keeps reconcile from firing at
  # all in a room where the only thing still lit is one we don't own.
  entities_still_on: >
    {{ resolved_entities | select('is_state', 'on') | reject('in', hands_off_entities) | list }}
  # Same as resolved_entities, but widened to every entity on each light's
  # device (not just the light itself) - lets scene-compatibility checking
  # below account for sibling entities, e.g. a light strip's effect selector.
  # entity_id branch filters to ^light\. before widening, same reason as
  # resolved_entities above - otherwise a directly-picked occupancy sensor's
  # own device siblings would incorrectly widen into scope too.
  scope_entities: >
    {% set ns = namespace(entities=[]) %}
    {% if room_target is not none %}
      {% if room_target.entity_id is defined %}
        {% set eids = room_target.entity_id if room_target.entity_id is iterable and room_target.entity_id is not string else [room_target.entity_id] %}
        {% for e in (eids | select('match', '^light\.') | list) %}
          {% set did = device_id(e) %}
          {% set ns.entities = ns.entities + (device_entities(did) if did else [e]) %}
        {% endfor %}
      {% endif %}
      {% if room_target.device_id is defined %}
        {% set dids = room_target.device_id if room_target.device_id is iterable and room_target.device_id is not string else [room_target.device_id] %}
        {% for d in dids %}
          {% set ns.entities = ns.entities + device_entities(d) %}
        {% endfor %}
      {% endif %}
      {% if room_target.area_id is defined %}
        {% set aids = room_target.area_id if room_target.area_id is iterable and room_target.area_id is not string else [room_target.area_id] %}
        {% for a in aids %}
          {% set ns.entities = ns.entities + area_entities(a) %}
        {% endfor %}
      {% endif %}
    {% endif %}
    {{ ns.entities | unique | list }}
  morning_scene: !input morning_scene
  day_scene: !input day_scene
  evening_scene: !input evening_scene
  night_scene: !input night_scene
  phase_scene: >
    {% set m = {'Morning': morning_scene, 'Day': day_scene, 'Evening': evening_scene, 'Night': night_scene} %}
    {{ m.get(states(adaptive_sensor)) }}
  # scene_template wins whenever it returns something valid (it can
  # react to things a phase alone can't, e.g. "if the TV is on") - the
  # per-phase pick is the fallback for when it doesn't apply. Either
  # way, a typo or a scene that's been renamed/removed is treated the
  # same as returning nothing, rather than erroring.
  desired_scene: >
    {% set candidate = (scene_template | trim) %}
    {% if candidate and states[candidate] is not none %}
      {{ candidate }}
    {% elif phase_scene and states[phase_scene] is not none %}
      {{ phase_scene }}
    {% else %}
      {{ '' }}
    {% endif %}
  scene_covered_entities: >
    {% if desired_scene | length > 0 %}
      {{ state_attr(desired_scene, 'entity_id') | default([], true) | list }}
    {% else %}
      {{ [] }}
    {% endif %}
  # The scene only counts as usable if every entity it covers is within our scope
  scene_valid: "{{ scene_covered_entities | reject('in', scope_entities) | list | length == 0 }}"
  scene_active: "{{ desired_scene | length > 0 and scene_valid }}"
  # Whether the "Activate matching scene" action step below should
  # actually bother calling scene.turn_on again this tick. Scenes carry
  # none of apply_lighting's own tolerance/override protections, so
  # re-issuing scene.turn_on on every single adaptive tick (which fires
  # roughly once a minute, on brightness/colour-temp alone - see the
  # adaptive trigger's own comment) would silently stomp a manual
  # change to any of the scene's own lights within a minute, for as
  # long as the scene stays active. A plain attribute tick has nothing
  # scene-relevant in it at all - desired_scene only depends on the
  # sensor's phase (its state string) and scene_template's own
  # dependencies (named via Additional Triggers, which fire their own
  # 'extra' id and are exempt from this check below) - so this only
  # actually recomputes to false for the specific case of an
  # adaptive-id tick whose phase didn't change. Every other trigger
  # (extra, motion_on, manual, recovered) is comparatively rare and
  # meaningful already, so always re-checks.
  scene_recheck_due: >
    {{ not (trigger is defined and trigger.id is defined and trigger.id == 'adaptive')
       or trigger.from_state is none
       or trigger.to_state is none
       or trigger.from_state.state != trigger.to_state.state }}
  # Lights the adaptive brightness/colour logic below should manage -
  # everything except what the active scene already covers, further
  # narrowed to already-on lights only when allow_turn_on is false (see
  # its own comment above) so a non-motion/non-manual tick can update
  # brightness/colour on lights that are on but can never switch one on.
  adaptive_target_entities: >
    {% set scoped = resolved_entities | reject('in', scene_covered_entities) | list if scene_active else resolved_entities %}
    {% if allow_turn_on %}
      {{ scoped }}
    {% else %}
      {{ scoped | reject('is_state', 'off') | list }}
    {% endif %}
action:
  - choose:
      # Motion timed out: turn everything reachable off - but only if
      # Room's occupancy is actually clear in aggregate right now.
      # occupancy.cleared fires per-entity, not per-target: with two
      # occupancy-class sensors in Room (e.g. a real motion sensor plus
      # a nightlight override sensor), this trigger fires the instant
      # EITHER one goes from on to off, even while the other is still
      # reporting occupied. Without this re-check, the real motion
      # sensor clearing overnight was turning lights off outright even
      # though the nightlight override sensor was still "on" the whole
      # time - confirmed live via automation.bedroom_hall_lights'
      # trace history, not just suspected. If occupancy.is_detected is
      # still true here (another sensor's still on), this branch's
      # conditions fail and default: below re-applies adaptive lighting
      # instead - a harmless, idempotent no-op if the light's already
      # at the right target (see grouping.py's tolerance check), or a
      # correct resync if it wasn't.
      - conditions:
          - condition: trigger
            id: motion_off
          - condition: not
            conditions:
              - condition: occupancy.is_detected
                target: !input room_target
        sequence:
          - alias: "Turn off the light(s)"
            action: light.turn_off
            target:
              entity_id: "{{ reachable_entities }}"
            data:
              transition: !input motion_off_transition
      # Periodic tick: if we're unoccupied but something's still on
      # (e.g. an earlier turn-off command didn't land), retry just that
      - conditions:
          - condition: trigger
            id: reconcile
        sequence:
          - if:
              # No occupancy sensor in Room means no independent "not
              # occupied" signal at all (see the occupied variable's
              # docstring) - so there's nothing to reconcile against and
              # this never fires, matching Reconcile Interval's own
              # description.
              - condition: template
                value_template: "{{ room_occupancy_entities | length > 0 }}"
              - condition: not
                conditions:
                  - condition: occupancy.is_detected
                    target: !input room_target
              - condition: template
                value_template: "{{ entities_still_on | length > 0 }}"
            then:
              - alias: "Reconcile: retry turning off lights left on with no occupancy"
                action: light.turn_off
                target:
                  entity_id: "{{ entities_still_on }}"
                data:
                  transition: !input motion_off_transition
    default:
      - if:
          - condition: template
            value_template: "{{ scene_active and scene_recheck_due }}"
        then:
          - alias: "Activate matching scene"
            action: scene.turn_on
            target:
              entity_id: "{{ desired_scene }}"
            data:
              transition: "{{ script_transition }}"
      # Reachability, multiplier bucketing, tolerance-based "already
      # correct" checks, externally-set protection, two-step/combined
      # routing, and RGB-vs-colour-temp dispatch are all handled by the
      # Adaptive Lighting Helpers integration (a standalone HACS add-on,
      # not specific to this blueprint - see its README) - this used to
      # be ~90 lines of namespace-loop Jinja, then a repeat/parallel
      # dispatch block, then a scene-mode choose: branch (removed - see
      # CLAUDE.md on why the "sensor requests scene.apply" mechanism was
      # dead code), here. apply_lighting reads brightness/colour
      # straight off adaptive_sensor itself and issues the
      # light.turn_on/turn_off calls directly.
      - alias: "Apply adaptive lighting (Adaptive Lighting Helpers)"
        action: adaptive_lighting_helpers.apply_lighting
        data:
          entities: "{{ adaptive_target_entities }}"
          brightness_multipliers: "{{ brightness_multipliers }}"
          sensor_entity_id: "{{ adaptive_sensor }}"
          transition: "{{ script_transition }}"
          prefer_rgb_color: "{{ prefer_rgb_color }}"
          # Identifies this room's automation as the owner of its own
          # writes (see docs/HELPERS.md's apply_lighting reference) -
          # without this, every call here would count as the explicit
          # force/override case and never leave an externally-changed
          # light alone. `this` is this automation's own state object,
          # so this.entity_id is stable per room and needs no input.
          owner_id: "{{ this.entity_id }}"
          # A manual run (someone hit "Run" on this automation, or
          # called automation.trigger directly) forces the whole tick
          # through regardless of override protection - owner_id is
          # still passed above, so the write is properly attributed and
          # a later, non-forced tick still recognises it as this
          # automation's own rather than finding an orphaned record.
          force: "{{ manual_run }}"
