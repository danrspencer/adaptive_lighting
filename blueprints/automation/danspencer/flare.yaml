blueprint:
  name: FLARE
  description: >
    FLARE: phase-based circadian lighting - sets brightness/colour
    temperature from a FLARE schedule sensor,
    keeping lights updated as it changes, and turns them off a while
    after occupancy clears. Full details on every input:
    [the blueprint reference](https://danrspencer.github.io/flare/blueprint/).
  domain: automation
  source_url: https://github.com/danrspencer/flare/blob/main/blueprints/automation/danspencer/flare.yaml
  author: Dan Spencer
  homeassistant:
    # Already required by the occupancy.* triggers/conditions below
    # (HA core-confirmed, see CLAUDE.md) - declared here for the first
    # time, prompted by the input sections below needing 2024.6.0, a
    # strictly lower floor than what this blueprint already assumed.
    min_version: 2026.4.0
  input:
    adaptive_sensor:
      name: FLARE Sensor
      description: >
        Sensor providing brightness and colour temperature to apply -
        filtered to FLARE's own schedule sensors.
      selector:
        entity:
          filter:
            - integration: flare
              domain: sensor
    room_target:
      name: Lights & Occupancy
      description: >
        Entity, device, area, floor, or label - lights within it are
        controlled, occupancy-class sensors within it decide when.
        [Details](https://danrspencer.github.io/flare/blueprint/#one-target-two-jobs).
      default: {}
      selector:
        target:
          entity:
            - domain: light
            - domain: binary_sensor
              device_class: occupancy
    extra_triggers:
      name: Additional Triggers (Optional)
      description: >
        Entities that trigger an immediate re-evaluation, e.g. a
        dependency of Scene Template or Brightness Multiplier Template.
        Only updates lights that are already on - never switches one on.
        [Details](https://danrspencer.github.io/flare/blueprint/#additional-triggers).
      default: []
      selector:
        entity:
          multiple: true
    colour:
      name: Colour
      icon: mdi:palette
      collapsed: true
      input:
        rgb_phases:
          name: Prefer RGB During
          description: >
            Phases to send RGB colour instead of colour temperature, for
            lights that support it (auto-detected). At the high colour
            temperatures used during Morning/Day, this can look
            blue-tinted rather than a clean white, so those phases are
            off by default - Evening/Night's warmer values don't have
            that problem.
            [Details](https://danrspencer.github.io/flare/blueprint/#rgb-colour).
          default: [Evening, Night]
          selector:
            select:
              options: [Morning, Day, Evening, Night]
              multiple: true
    scene_handoff:
      name: Scene Handoff
      icon: mdi:palette-swatch
      collapsed: true
      input:
        scene_template:
          name: Scene Template (Optional)
          description: >
            Template returning a scene entity_id to hand the room over
            to instead of the adaptive brightness/colour. Takes
            precedence over the per-phase scenes below whenever it
            returns one - they're the fallback for phases it doesn't
            cover.
            [Details](https://danrspencer.github.io/flare/blueprint/#scene-handoff).
          default: ""
          selector:
            template: {}
        morning_scene:
          name: Morning Scene (Optional)
          default: null
          selector:
            entity:
              domain: scene
        day_scene:
          name: Day Scene (Optional)
          default: null
          selector:
            entity:
              domain: scene
        evening_scene:
          name: Evening Scene (Optional)
          default: null
          selector:
            entity:
              domain: scene
        night_scene:
          name: Night Scene (Optional)
          default: null
          selector:
            entity:
              domain: scene
    brightness_exclusions:
      name: Brightness & Exclusions
      icon: mdi:brightness-percent
      collapsed: true
      input:
        brightness_multiplier_template:
          name: Brightness Multiplier Template (Optional)
          description: >
            Template returning entity_id → brightness multiplier (0 =
            off, null = skip entirely). Its own per-entity values always
            win over the per-phase exclusions below - those only fill in
            entities it doesn't already mention.
            [Details](https://danrspencer.github.io/flare/blueprint/#per-light-brightness-scaling).
          default: "{{ {} }}"
          selector:
            template: {}
        morning_exclude_lights:
          name: Lights Off During Morning (Optional)
          selector:
            entity:
              domain: light
              multiple: true
          default: []
        day_exclude_lights:
          name: Lights Off During Day (Optional)
          selector:
            entity:
              domain: light
              multiple: true
          default: []
        evening_exclude_lights:
          name: Lights Off During Evening (Optional)
          selector:
            entity:
              domain: light
              multiple: true
          default: []
        night_exclude_lights:
          name: Lights Off During Night (Optional)
          selector:
            entity:
              domain: light
              multiple: true
          default: []
    timing:
      name: Timing
      icon: mdi:timer-outline
      collapsed: true
      input:
        no_motion_wait:
          name: Wait time
          description: Time to keep the light on after motion stops.
          default: 120
          selector:
            number:
              min: 0
              max: 3600
              unit_of_measurement: seconds
        update_interval:
          name: Update Interval (Optional)
          description: >
            How often to check the lights are up to date, outside of a
            phase change or motion - if everything's already correct,
            nothing is sent. Home Assistant's time_pattern syntax, e.g.
            '/1' for every minute.
            [Details](https://www.home-assistant.io/docs/automation/trigger/#time-pattern-trigger).
          default: "/1"
          selector:
            text: {}
        update_jitter:
          name: Update Jitter (Optional)
          description: >
            Spreads scheduled updates over a random delay, in seconds,
            so multiple rooms using the same FLARE Sensor don't all
            send commands at the same instant. Set to 0 to
            disable.
          default: 15
          selector:
            number:
              min: 0
              max: 59
              unit_of_measurement: seconds
        motion_on_transition:
          name: Motion On Transition
          description: Transition duration when turning on via motion or a manual run.
          default: 1
          selector:
            number:
              min: 0
              max: 60
              unit_of_measurement: seconds
        motion_off_transition:
          name: Motion Off Transition
          description: Transition duration when turning off via motion.
          default: 15
          selector:
            number:
              min: 0
              max: 60
              unit_of_measurement: seconds
        background_transition:
          name: Background Transition
          description: Transition duration when the schedule, the scene template, or an Additional Trigger updates - i.e. nothing a person is actively waiting on.
          default: 30
          selector:
            number:
              min: 0
              max: 60
              unit_of_measurement: seconds

mode: restart
max_exceeded: silent

# Available to trigger definitions themselves (trigger: / condition:),
# unlike the variables: block below which isn't computed until after a
# trigger has fired - needed here so the `recovered` trigger's own
# template (which can't call a service, so can't reuse resolved_entities)
# can resolve room_target into light entities itself.
trigger_variables:
  room_target: !input room_target

trigger:
  # The live brightness/colour sensor, but only on a genuine phase
  # transition - not the attribute-only ticks that happen every ~60s
  # while the curve ramps. Ramp tracking isn't lost; adaptive_tick below
  # covers it unconditionally.
  #
  # The `to:` list is what does this. With no from:/to: filter at all a
  # `platform: state` trigger also fires on attribute-only changes; with
  # any of them present HA rejects events where old and new values are
  # equal, i.e. it requires a real value change. `from:` is left
  # unrestricted so a transition into a real phase from unknown/
  # unavailable (a restart, or the first-ever value) still fires.
  - platform: state
    entity_id: !input adaptive_sensor
    id: adaptive
    to:
      - Morning
      - Day
      - Evening
      - Night
  # Periodic floor tick, on its own configurable interval - the sole
  # driver of ordinary brightness/colour tracking now that `adaptive`
  # only fires on a real phase change, and the only tick at all during
  # Morning/Night, where the curve is flat and the sensor's attributes
  # never change. This is what makes "the next tick will fix it" always
  # true. Also hosts the self-heal check (see the adaptive_tick branch in
  # action:, which decides whether a given tick is a self-heal one).
  #
  # A separate id from `adaptive` deliberately: scene_recheck_due reads
  # trigger.from_state/to_state, which a time_pattern trigger has no
  # equivalent of, and attribute access on an undefined name raises and
  # aborts the whole run.
  - id: adaptive_tick
    platform: time_pattern
    minutes: !input update_interval
  # Anything named in Additional Triggers changed - e.g. a TV for a
  # brightness multiplier, or whatever the scene template depends on
  - id: extra
    platform: state
    entity_id: !input extra_triggers
  # Room's occupancy-class sensors (entity/device/area/floor/label)
  # just reported occupied - aggregates every matching occupancy sensor
  # automatically via Home Assistant's built-in Occupancy triggers. Left
  # unconditionally attached rather than disabled when Room has no
  # occupancy sensor in it - target is a required field for this trigger
  # type, but a target matching zero entities is a harmless no-op (see
  # CLAUDE.md for why this couldn't just be gated the way the old
  # separate Occupancy Sensor input was).
  - id: motion_on
    trigger: occupancy.detected
    target: !input room_target
  # Room's occupancy-class sensors have been continuously clear for no_motion_wait
  - id: motion_off
    trigger: occupancy.cleared
    target: !input room_target
    options:
      for:
        seconds: !input no_motion_wait
  - id: recovered
    platform: template
    value_template: >
      {#
        Fires when one of our lights recovers from unavailable/unknown -
        a Zigbee mesh drop, or a physical power switch cutting and then
        restoring power to the room. Purely a promptness mechanism: it
        causes an ordinary tick to run right away, the same as any
        `extra` trigger firing, rather than waiting for the room's next
        unrelated tick (the periodic adaptive sensor tick, at most a
        minute or so) to notice. It carries no special handling of its
        own beyond that - no forced write, no scoped resync, no
        occupancy bypass. Whatever the recovered light's own current
        state is (on or off) just flows through the exact same
        adaptive_target_entities/allow_turn_on logic every other light
        in the room does: off stays off, on gets corrected.

        The reason this needs its own dedicated trigger at all, rather
        than "just let the next tick handle it": write_tracking.py
        (FLARE) clears an entity's override-
        protection record the moment it's observed going unavailable -
        so by the time it reconnects there's no stale record for its
        fresh post-reconnect context.id to conflict with - but nothing
        makes that reconnect happen *promptly* on its own; this trigger
        is what closes that gap.

        IMPORTANT: this template can't reference `trigger.*` itself -
        confirmed against HA core's own template trigger source
        (homeassistant/components/template/trigger.py): the value_template
        that decides *whether to fire* is rendered with only this
        automation's trigger_variables in scope; `trigger` is only
        injected afterwards, into the fired action's own variables, from
        the real state_changed event that caused the render - a
        different pass entirely. An earlier version of this template did
        reference `trigger.entity_id`/`from_state`/`to_state` here, which
        meant `trigger is defined` was always false and this trigger
        could never fire at all - caught live when Living Room/Study
        never resynced after being power-cycled, despite the automation
        traces showing no `recovered`-triggered run at all. So it has to
        be an aggregate over the room, with no per-entity information.

        The aggregate is "at least one of our lights is reachable",
        which arms while the whole room is dark and fires as the first
        bulb comes back. It used to be the inverse - "none of our lights
        are unavailable" - and that had a fatal flaw in any real house:
        a single orphaned entity that is *permanently* unavailable (a
        deleted Zigbee group whose entity was never cleaned up, say)
        holds the aggregate false forever, so the trigger can never fire
        again in that room. Found live in the Ensuite, where
        light.ensuite_spots - a group that no longer exists - had
        silently disabled recovery for the whole room.

        Known and accepted blind spot of this shape: one flaky bulb
        dropping and recovering while its siblings stay up doesn't move
        the aggregate at all, so nothing fires. That case is left to the
        periodic adaptive tick (see the `adaptive_tick` trigger below,
        which exists precisely so there is always a tick to fall back
        on, even when the curve is flat and the sensor stops changing).
        Trading a rare miss that something else mops up for an entire
        room going permanently dead is the right way round.
      #}
      {% set ns = namespace(entities=[]) %}
      {% if room_target is not none %}
        {% if room_target.entity_id is defined %}
          {% set eids = room_target.entity_id if room_target.entity_id is iterable and room_target.entity_id is not string else [room_target.entity_id] %}
          {% set ns.entities = ns.entities + (eids | select('match', '^light\\.') | list) %}
        {% endif %}
        {% if room_target.device_id is defined %}
          {% set dids = room_target.device_id if room_target.device_id is iterable and room_target.device_id is not string else [room_target.device_id] %}
          {% for d in dids %}
            {% set ns.entities = ns.entities + (device_entities(d) | select('match', '^light\\.') | list) %}
          {% endfor %}
        {% endif %}
        {% if room_target.area_id is defined %}
          {% set aids = room_target.area_id if room_target.area_id is iterable and room_target.area_id is not string else [room_target.area_id] %}
          {% for a in aids %}
            {% set ns.entities = ns.entities + (area_entities(a) | select('match', '^light\\.') | list) %}
          {% endfor %}
        {% endif %}
      {% endif %}
      {% set light_entity_ids = ns.entities | unique | list %}
      {{ light_entity_ids
         | reject('is_state', 'unavailable') | reject('is_state', 'unknown')
         | list | length > 0 }}

condition:
  # Occupancy has exactly two jobs here, and neither is "should we update
  # already-on lights": turning a room on via motion, and turning it off
  # once confirmed empty (motion_off and the self-heal branch in action:).
  # condition: checks occupancy nowhere - adaptive/extra/recovered always
  # proceed, since an already-on light should track the curve regardless
  # of who is in the room. motion_on keeps an efficiency check only (skip
  # the call if there is nothing to turn on); allow_turn_on below is what
  # actually decides permission.
  - or:
      - condition: not
        conditions:
          - condition: trigger
            id: motion_on
      - condition: and
        conditions:
          - condition: trigger
            id: motion_on
          - condition: template
            value_template: "{{ resolved_entities | map('states') | select('ne', 'on') | list | count > 0 }}"

variables:
  room_target: !input room_target
  adaptive_sensor: !input adaptive_sensor
  scene_template: !input scene_template
  background_transition: !input background_transition
  motion_on_transition: !input motion_on_transition
  # Exposed as a variable (not just used inline via !input, the way
  # motion_off_transition still is) specifically so the reconcile
  # condition below can reference it inside a Jinja template - see that
  # condition's own comment for why it's a template rather than
  # occupancy.is_not_detected's native `for:` option.
  no_motion_wait: !input no_motion_wait
  # Exposed as a variable for the same reason as no_motion_wait above -
  # the jitter delay step in action: below needs to reference it inside
  # a Jinja template.
  update_jitter: !input update_jitter
  rgb_phases: !input rgb_phases
  prefer_rgb_color: "{{ states(adaptive_sensor) in rgb_phases }}"
  script_transition: >
    {# Slow, smooth transition for adaptive/extra/recovered updates -
       none of these are a person waiting on a response in real time,
       so there's no reason to snap. Snappier for actual motion or a
       manual run instead. #}
    {% if trigger is defined and trigger.id is defined and trigger.id in ['adaptive', 'adaptive_tick', 'extra', 'recovered'] %}
      {{ background_transition }}
    {% else %}
      {{ motion_on_transition }}
    {% endif %}
  # This run wasn't started by any of the triggers above at all - the
  # user hit "Run" on the automation itself, or called automation.trigger
  # directly. Used below to force this whole tick through regardless of
  # override protection, matching the same "I ran this on purpose, take
  # it back" intent a direct apply_lighting force call has. `trigger`
  # itself is still defined for a manual run (confirmed live - an
  # earlier `trigger is not defined` version of this check silently
  # never fired), it's `trigger.id` that isn't.
  manual_run: "{{ not (trigger is defined and trigger.id is defined) }}"
  # The brightness-multiplier chain is resolved up here, before
  # reachable_entities/entities_still_on below, because those two now
  # need hands_off_entities to build their turn-off lists. HA renders
  # variables: strictly top to bottom, each key only seeing the ones
  # declared above it, so this block cannot be moved back down.
  template_brightness_multipliers: !input brightness_multiplier_template
  morning_exclude_lights: !input morning_exclude_lights
  day_exclude_lights: !input day_exclude_lights
  evening_exclude_lights: !input evening_exclude_lights
  night_exclude_lights: !input night_exclude_lights
  phase_exclude_lights: >
    {% set m = {'Morning': morning_exclude_lights, 'Day': day_exclude_lights,
                'Evening': evening_exclude_lights, 'Night': night_exclude_lights} %}
    {{ m.get(states(adaptive_sensor), []) }}
  # The per-phase exclude list only fills in entities the template
  # doesn't already mention - its own per-entity values always win on
  # collision, so a room's existing template logic (e.g. dining_room_lighting's
  # illuminance-based override, unrelated to phase) can't be silently
  # discarded by also setting a phase exclusion.
  brightness_multipliers: >
    {% set ns = namespace(m={}) %}
    {% for e in phase_exclude_lights %}
      {% set ns.m = dict(ns.m, **{e: 0}) %}
    {% endfor %}
    {{ dict(ns.m, **template_brightness_multipliers) }}
  # Lights the multiplier template handed off entirely: a null/false
  # multiplier means "something else owns this, don't touch it", as
  # opposed to 0, which means "turn this one off". Those two must not be
  # conflated - and in Jinja, as in Python, `0 == false` is true, so an
  # `in [none, false]` membership test would wrongly swallow every 0 as
  # well. `is sameas false` is an identity check, mirroring exactly what
  # grouping.py's own `m is None or m is False` bucketing does.
  #
  # Used by the two turn-off paths below (motion_off and reconcile).
  # apply_lighting already skips these on its own, so a hands-off light
  # was never *dimmed* by this blueprint - but until this existed it was
  # still being switched off with the rest of the room, which made the
  # handoff only half-honoured. Caught live: a kitchen strip offloaded to
  # its own gradient automation was still being turned off on every
  # motion-clear and reconcile tick.
  hands_off_entities: >
    {% set ns = namespace(items=[]) %}
    {% for entity_id, multiplier in brightness_multipliers.items() %}
      {% if multiplier is none or multiplier is sameas false %}
        {% set ns.items = ns.items + [entity_id] %}
      {% endif %}
    {% endfor %}
    {{ ns.items }}
  # Extracted here as plain state_attr() reads and passed to
  # apply_lighting as literal values - it reads no sensor entity itself,
  # matching compute_lighting_groups exactly. It did read one internally
  # once; that was reverted deliberately and is meant to stay reverted
  # (see CLAUDE.md).
  brightness: "{{ state_attr(adaptive_sensor, 'brightness') }}"
  color_temp_kelvin: "{{ state_attr(adaptive_sensor, 'color_temp') }}"
  # None whenever adaptive_sensor doesn't populate this attribute (a
  # hand-rolled "bring your own sensor" entity not using prefer_rgb_color
  # is free to omit it - see docs/blueprint.md) - apply_lighting's own
  # rgb_color field explicitly tolerates an explicit null, not just an
  # omitted key, for exactly this reason.
  rgb_color: "{{ state_attr(adaptive_sensor, 'rgb_color') }}"
  # room_target resolved once here; the three consumers below are filters
  # over the result. Entity/device/area only - floor/label aren't
  # resolvable in hand-rolled Jinja the way they are through the native
  # occupancy.* trigger/condition (pre-existing gap).
  #
  # Two halves, not one list: scope_entities needs them apart, because a
  # directly *named* light also pulls in its device's siblings while the
  # device/area halves already return those. Merging would widen scene
  # scope.
  target_named_entities: >
    {% if room_target is not none and room_target.entity_id is defined %}
      {% set v = room_target.entity_id %}
      {{ v if v is iterable and v is not string else [v] }}
    {% else %}
      {{ [] }}
    {% endif %}
  target_expanded_entities: >
    {% set ns = namespace(entities=[]) %}
    {% if room_target is not none %}
      {% if room_target.device_id is defined %}
        {% set v = room_target.device_id %}
        {% for d in (v if v is iterable and v is not string else [v]) %}
          {% set ns.entities = ns.entities + device_entities(d) %}
        {% endfor %}
      {% endif %}
      {% if room_target.area_id is defined %}
        {% set v = room_target.area_id %}
        {% for a in (v if v is iterable and v is not string else [v]) %}
          {% set ns.entities = ns.entities + area_entities(a) %}
        {% endfor %}
      {% endif %}
    {% endif %}
    {{ ns.entities | unique | list }}
  all_target_entities: >
    {{ (target_named_entities + target_expanded_entities) | unique | list }}
  # Every light this automation is allowed to touch - room_target can
  # also directly name occupancy-class sensor entities, hence the filter.
  resolved_entities: >
    {{ all_target_entities | select('match', '^light\\.') | list }}
  # Which FLARE tracking scope this room's writes belong to - resolved
  # here, once, rather than left for the integration to search for.
  # Room Target names an area directly, that area's own state device
  # wins outright: "pick the area, the scope comes with it". Otherwise
  # (Room Target names entities/a device with no area) falls back to
  # the resolved lights' own area, first one that actually has a state
  # device - the same entity->area fallback the integration used to do
  # internally, now done here where the caller can see it.
  #
  # Either way this only ever finds a scope whose target reduces to a
  # single area, since that's the only shape a state device's own
  # tracking-sensor device lands in an area at all (see
  # sensor.py's _assign_scope_area) - a scope spanning several areas,
  # or targeting devices/entities directly, isn't discoverable this
  # way. None here means untracked, not "go find out" - a room whose
  # lights don't resolve to any state device's area simply isn't
  # tracked, the same as passing no scope to any of these services
  # directly.
  tracking_scope_device_id: >
    {% if room_target is not none and room_target.area_id is defined %}
      {% set aids = room_target.area_id %}
      {% set aid = (aids if aids is iterable and aids is not string else [aids]) | first %}
    {% else %}
      {% set candidate_areas = resolved_entities | map('area_id') | reject('none') | unique | list %}
      {% set aid = candidate_areas | first if candidate_areas | length > 0 else none %}
    {% endif %}
    {% set tracking_entities = area_entities(aid) | select('search', '^sensor\\..*_flare_tracking$') | list if aid is not none else [] %}
    {{ device_id(tracking_entities | first) if tracking_entities | length > 0 else none }}
  # Entities HA already knows it can't reach right now - no point
  # commanding them - minus anything the multiplier template handed off
  # (see hands_off_entities above). Only feeds the motion_off turn-off.
  reachable_entities: >
    {{ resolved_entities | reject('is_state', 'unavailable') | reject('is_state', 'unknown')
       | reject('in', hands_off_entities) | list }}
  # room_target's occupancy-class binary_sensor entities. Only used to
  # decide *whether* Room has an occupancy sensor at all, for the
  # condition:/self-heal branches below - occupancy.is_detected itself
  # still does the real detection natively.
  room_occupancy_entities: >
    {{ all_target_entities | select('match', '^binary_sensor\\.')
       | select('is_state_attr', 'device_class', 'occupancy') | list }}
  occupied: >
    {#
      Is the room "in use" right now - originally for the
      no-occupancy-sensor condition: branch only (see below), now also
      the "the room's clearly in use" half of allow_turn_on just below.
      Without a sensor, the only signal available is whether we've
      already turned something on - the same "a light being on doesn't
      really mean anyone's still there" imprecision the original bug
      this guard fixes was about, unavoidable without a real sensor.
    #}
    {{ resolved_entities | map('states') | select('eq', 'on') | list | count > 0 }}
  # Only three things may turn an off light on: motion detecting someone,
  # a deliberate manual run, or the room already being in active use
  # (at least one of its lights already on). Everything else reaching
  # default: below - adaptive, extra, recovered - may only update lights
  # that are already on. condition: doesn't gate any of this on occupancy
  # (see its own comment); this is the only place that decides it, and it
  # applies uniformly to every trigger, recovered included.
  #
  # Load-bearing: grouping.py treats an off light as "not yet at target"
  # and so would include it for turning on - correct for motion_on, wrong
  # for everything else. Without this, a light off at bedtime came back on
  # from a network blip. The `occupied` branch is room-level, not
  # per-light, so one lamp off in an in-use room still gets topped up.
  allow_turn_on: >
    {{ manual_run
       or (trigger is defined and trigger.id is defined and trigger.id == 'motion_on')
       or occupied }}
  # Used by the reconcile action branch below to retry turning off
  # anything still on - excluding handed-off lights (see
  # hands_off_entities above), which also keeps reconcile from firing at
  # all in a room where the only thing still lit is one we don't own.
  entities_still_on: >
    {{ resolved_entities | select('is_state', 'on') | reject('in', hands_off_entities) | list }}
  # Same as resolved_entities, but widened to every entity on each light's
  # device (not just the light itself) - lets scene-compatibility checking
  # below account for sibling entities, e.g. a light strip's effect selector.
  # entity_id branch filters to ^light\. before widening, same reason as
  # resolved_entities above - otherwise a directly-picked occupancy sensor's
  # own device siblings would incorrectly widen into scope too.
  scope_entities: >
    {% set ns = namespace(entities=target_expanded_entities) %}
    {% for e in (target_named_entities | select('match', '^light\\.') | list) %}
      {% set did = device_id(e) %}
      {% set ns.entities = ns.entities + (device_entities(did) if did else [e]) %}
    {% endfor %}
    {{ ns.entities | unique | list }}
  morning_scene: !input morning_scene
  day_scene: !input day_scene
  evening_scene: !input evening_scene
  night_scene: !input night_scene
  phase_scene: >
    {% set m = {'Morning': morning_scene, 'Day': day_scene, 'Evening': evening_scene, 'Night': night_scene} %}
    {{ m.get(states(adaptive_sensor)) }}
  # scene_template wins whenever it returns something valid (it can react
  # to things a phase alone can't, e.g. "if the TV is on"); the per-phase
  # pick is the fallback. A typo or a renamed/removed scene is treated as
  # returning nothing rather than erroring.
  #
  # candidate must pass an entity_id shape check before reaching
  # states[candidate]: states[] raises a hard TemplateError - not "not
  # found" - on a string that isn't even entity_id-shaped, aborting the
  # whole variables: block before condition:/action: run. phase_scene
  # needs no such guard; it comes from a domain: scene selector.
  desired_scene: >
    {% set candidate = (scene_template | trim) %}
    {% if candidate and candidate is match('^[a-z0-9_]+\\.[a-z0-9_]+$') and states[candidate] is not none %}
      {{ candidate }}
    {% elif phase_scene and states[phase_scene] is not none %}
      {{ phase_scene }}
    {% else %}
      {{ '' }}
    {% endif %}
  scene_covered_entities: >
    {% if desired_scene | length > 0 %}
      {{ state_attr(desired_scene, 'entity_id') | default([], true) | list }}
    {% else %}
      {{ [] }}
    {% endif %}
  # The scene only counts as usable if every entity it covers is within our scope
  scene_valid: "{{ scene_covered_entities | reject('in', scope_entities) | list | length == 0 }}"
  scene_active: "{{ desired_scene | length > 0 and scene_valid }}"
  # Lights this tick has deliberately handed off - to an active scene,
  # or to whatever owns them via a null/false multiplier. apply_lighting
  # never writes these, so their override-protection claims would freeze
  # at the last real write and get reported as "overridden", which is
  # indistinguishable from someone grabbing a light by hand. The action
  # step below releases them instead.
  #
  # scene_active gates the scene half deliberately: a scene that exists
  # but reaches outside scope has a non-empty scene_covered_entities
  # while adaptive still manages those lights - releasing them there
  # would be wrong.
  handed_off_entities: >
    {{ ((scene_covered_entities if scene_active else []) + hands_off_entities) | unique | list }}
  # Whether the "Activate matching scene" step below should call
  # scene.turn_on again this tick. Scenes carry none of apply_lighting's
  # tolerance/override protections, so re-issuing it every minute would
  # silently stomp a manual change to any of the scene's own lights.
  #
  # desired_scene depends only on the sensor's phase and on
  # scene_template's own dependencies (which fire their own 'extra' id,
  # exempt below) - so the only tick worth skipping is an `adaptive` one
  # whose phase didn't change. Every other trigger is rare and meaningful
  # already. The periodic floor tick is excluded outright: it has no
  # from_state/to_state to compare (reading them would raise and abort
  # the run), and treating every minute as "recheck due" is exactly what
  # this variable exists to prevent.
  scene_recheck_due: >
    {% if trigger is defined and trigger.id is defined and trigger.id == 'adaptive_tick' %}
      false
    {% else %}
      {{ not (trigger is defined and trigger.id is defined and trigger.id == 'adaptive')
         or trigger.from_state is none
         or trigger.to_state is none
         or trigger.from_state.state != trigger.to_state.state }}
    {% endif %}
  # Lights the adaptive brightness/colour logic below should manage -
  # everything except what the active scene already covers, further
  # narrowed to already-on lights only when allow_turn_on is false (see
  # its own comment above) so a non-motion/non-manual tick can update
  # brightness/colour on lights that are on but can never switch one on.
  adaptive_target_entities: >
    {% set scoped = resolved_entities | reject('in', scene_covered_entities) | list if scene_active else resolved_entities %}
    {% if allow_turn_on %}
      {{ scoped }}
    {% else %}
      {{ scoped | reject('is_state', 'off') | list }}
    {% endif %}
action:
  # Spreads a phase change or the periodic tick's writes across a random
  # window, so rooms sharing one sensor don't all command in the same
  # wall-clock second - most acute at a phase boundary, where every such
  # room fires at literally the same instant. Placed first so it applies
  # regardless of which branch below runs. Every other trigger renders 0,
  # which HA short-circuits synchronously; extra/recovered are inherently
  # per-room, so there is no cascade for jitter to address there.
  #
  # mode: restart means a genuine trigger mid-delay preempts a jittered
  # run: a new run stops the in-flight one, resolving the delay's awaited
  # stop future, and it aborts before reaching the choose: block.
  - alias: "Jitter: spread a phase change or the periodic Update tick's writes across a random window"
    delay:
      seconds: >-
        {% if trigger is defined and trigger.id is defined and trigger.id in ['adaptive', 'adaptive_tick'] %}
          {{ range(0, (update_jitter | int) + 1) | random }}
        {% else %}
          0
        {% endif %}
  - choose:
      # Motion timed out: turn everything reachable off - but only if
      # Room's occupancy is clear in aggregate right now.
      # occupancy.cleared fires per-entity, not per-target, so with two
      # occupancy-class sensors in Room it fires the instant EITHER goes
      # off, even while the other still reports occupied. Without this
      # re-check a real motion sensor clearing overnight turned lights
      # off while a nightlight override sensor was still on. If another
      # sensor is still on these conditions fail and default: reapplies
      # adaptive lighting instead - an idempotent no-op if the light is
      # already correct.
      - conditions:
          - condition: trigger
            id: motion_off
          - condition: not
            conditions:
              - condition: occupancy.is_detected
                target: !input room_target
        sequence:
          - alias: "Turn off the light(s)"
            action: light.turn_off
            target:
              entity_id: "{{ reachable_entities }}"
            data:
              transition: !input motion_off_transition
          - alias: "Record the turn-off as ours"
            # Without this the integration sees a light go off under a
            # context it has no claim for and reads it as someone else
            # switching it off - which is exactly what it should read a
            # *hand* turn-off as. Skipped entirely with no resolvable
            # scope: recording accomplishes nothing when nothing is
            # tracking these lights, and record_write now requires
            # tracking_device_id rather than treating it as optional.
            if:
              - condition: template
                value_template: "{{ tracking_scope_device_id is not none }}"
            then:
              - action: flare.record_write
                data:
                  entities: "{{ reachable_entities }}"
                  tracking_device_id: "{{ tracking_scope_device_id }}"
                  # dict(a, **b) rather than dict.fromkeys: the same
                  # construct used for the brightness multipliers below,
                  # and known to work in HA's Jinja.
                  targets: >-
                    {% set ns = namespace(t={}) %}
                    {% for e in reachable_entities %}
                      {% set ns.t = dict(ns.t, **{e: {'state': 'off'}}) %}
                    {% endfor %}
                    {{ ns.t }}
      # Self-healing: on an adaptive_tick, if the room is unoccupied but
      # something is still on (an earlier turn-off didn't land), retry
      # just that. These conditions - not trigger.id alone - decide
      # whether THIS tick is a self-heal one; when they don't all hold
      # the branch doesn't match and default: reapplies lighting as any
      # other adaptive_tick would.
      #
      # Deliberately exclusive of default: rather than doing both.
      # entities_still_on and adaptive_target_entities are computed once
      # in variables:, before action: runs, so they don't reflect this
      # branch's own turn_off - reapplying in the same run risks
      # apply_lighting turning the just-turned-off light straight back
      # on. The next tick resumes tracking, a one-tick lag this check
      # already had.
      - conditions:
          - condition: trigger
            id: adaptive_tick
          # No occupancy sensor in Room means no independent "not
          # occupied" signal at all (see the occupied variable's
          # docstring) - so there's nothing to reconcile against and
          # this never matches, matching Update Interval's own
          # description.
          - condition: template
            value_template: "{{ room_occupancy_entities | length > 0 }}"
          # Requires occupancy continuously clear for the full Wait
          # time, not just clear at this instant. Unlike motion_off
          # above (whose trigger-level for: provides this), the
          # self-heal check has no relationship to occupancy timing on
          # its own, so nothing else debounces it - a bare
          # "not occupancy.is_detected" let a momentary sensor blip turn
          # lights off, bypassing Wait time entirely.
          #
          # A plain template, not occupancy.is_not_detected's native
          # `for:`, which does exist: `for:` needs the recorder to prime
          # a duration already satisfied before the condition started
          # watching - exactly the situation after a restart.
          # last_changed is a plain property answered from memory,
          # needing no priming and no recorder.
          - condition: template
            value_template: >-
              {% set ns = namespace(all_clear=true) %}
              {% for e in room_occupancy_entities %}
                {% if not is_state(e, 'off') or
                      (now() - states[e].last_changed).total_seconds() < (no_motion_wait | int) %}
                  {% set ns.all_clear = false %}
                {% endif %}
              {% endfor %}
              {{ ns.all_clear }}
          - condition: template
            value_template: "{{ entities_still_on | length > 0 }}"
        sequence:
          - alias: "Self-heal: retry turning off lights left on with no occupancy"
            action: light.turn_off
            target:
              entity_id: "{{ entities_still_on }}"
            data:
              transition: !input motion_off_transition
          - alias: "Record the turn-off as ours"
            # Without this the integration sees a light go off under a
            # context it has no claim for and reads it as someone else
            # switching it off - which is exactly what it should read a
            # *hand* turn-off as. Skipped entirely with no resolvable
            # scope - see the motion_off branch's own copy of this step
            # above for why.
            if:
              - condition: template
                value_template: "{{ tracking_scope_device_id is not none }}"
            then:
              - action: flare.record_write
                data:
                  entities: "{{ entities_still_on }}"
                  tracking_device_id: "{{ tracking_scope_device_id }}"
                  targets: >-
                    {% set ns = namespace(t={}) %}
                    {% for e in entities_still_on %}
                      {% set ns.t = dict(ns.t, **{e: {'state': 'off'}}) %}
                    {% endfor %}
                    {{ ns.t }}
    default:
      - if:
          - condition: template
            value_template: "{{ scene_active and scene_recheck_due }}"
        then:
          - alias: "Activate matching scene"
            action: scene.turn_on
            target:
              entity_id: "{{ desired_scene }}"
            data:
              transition: "{{ script_transition }}"
      # Releasing says the truthful thing: nothing is managing these
      # lights right now. Nothing is given up by it - they aren't being
      # written, so there is no protection to lose, and the next tick
      # that does manage them re-establishes a claim through the
      # ordinary first-write path. clear_claims is a no-op for an
      # entity with no record, so this costs nothing on the ticks where
      # it changes nothing - but it also now requires a scope, so the
      # condition guards on one resolving at all, not just on there
      # being entities to name.
      - alias: "Release lights handed off to a scene or another owner"
        if:
          - condition: template
            value_template: >-
              {{ handed_off_entities | length > 0 and tracking_scope_device_id is not none }}
        then:
          - action: flare.clear_claims
            data:
              entities: "{{ handed_off_entities }}"
              tracking_device_id: "{{ tracking_scope_device_id }}"
      # Reachability, multiplier bucketing, tolerance checks, override
      # protection, two-step/combined routing and RGB-vs-colour-temp
      # dispatch all live in the FLARE integration
      # (standalone HACS add-on, not specific to this blueprint).
      #
      # Guarded because brightness/color_temp_kelvin are plain state_attr()
      # reads: an unavailable sensor, or one pointed at a renamed/deleted
      # entity, renders them null, and apply_lighting requires both - so
      # the action would fail validation on every tick, indefinitely.
      # Guards this one step rather than condition:, which would gate the
      # whole tick - motion_off and self-heal turn lights *off* and need
      # nothing from the sensor. Skipping is right: with no target there
      # is nothing to apply, and a default would drive lights to a made-up
      # value.
      - alias: "Apply adaptive lighting, unless the sensor has no target to apply"
        if:
          - condition: template
            value_template: "{{ brightness is not none and color_temp_kelvin is not none }}"
        then:
        - alias: "Apply adaptive lighting (FLARE)"
          action: flare.apply_lighting
          data:
            entities: "{{ adaptive_target_entities }}"
            brightness_multipliers: "{{ brightness_multipliers }}"
            brightness: "{{ brightness }}"
            color_temp_kelvin: "{{ color_temp_kelvin }}"
            rgb_color: "{{ rgb_color }}"
            transition: "{{ script_transition }}"
            prefer_rgb_color: "{{ prefer_rgb_color }}"
            tracking_device_id: "{{ tracking_scope_device_id }}"
            # A manual run (someone hit "Run" on this automation, or
            # called automation.trigger directly) forces the whole tick
            # through regardless of override protection.
            force: "{{ manual_run }}"
