name: docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Lets the deploy job publish to GitHub Pages. Read-only elsewhere.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead. In-progress runs finish
# rather than being cancelled, so a half-published site can't happen.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The playground page renders the integration's REAL dashboard
      # card, which lives outside docs/ - and Jekyll can only serve files
      # under its own source directory. Copying it in at build time
      # rather than committing a second copy means the site can never
      # show a stale card.
      - name: Copy the dashboard card into the site
        run: |
          cp custom_components/adaptive_lighting_helpers/www/adaptive-lighting-curve-card.js \
             docs/assets/js/adaptive-lighting-curve-card.js

      - uses: ruby/setup-ruby@v1
        with:
          # Jekyll 4, not the github-pages gem's Jekyll 3 - docs/_config.yml
          # needs render_with_liquid. See the comment there.
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: docs

      - name: Build site
        working-directory: docs
        # JEKYLL_ENV=production so the theme emits canonical URLs and
        # skips its development-only output.
        run: JEKYLL_ENV=production bundle exec jekyll build --trace

      # No configure-pages step: it only exists to inject a baseurl for
      # sites that don't set their own, and it FAILS outright until Pages
      # has been enabled on the repository. docs/_config.yml sets baseurl
      # explicitly, so skipping it lets pull requests fully build and
      # validate the site whether or not Pages is switched on yet.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_site

  # Only main publishes. Pull requests still run the build above, so a
  # broken site fails review rather than fails after merge.
  #
  # This job needs Pages enabled on the repository with its source set
  # to "GitHub Actions" (Settings -> Pages). Until that's done it is
  # the only part of this workflow that can't succeed.
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
