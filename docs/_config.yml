title: FLARE
description: Flexible Lighting Automation & Reconciliation Engine — phase-based circadian lighting for Home Assistant, with scene reconciliation and override protection built in.
url: https://danrspencer.github.io
baseurl: /flare

theme: just-the-docs

# _includes/title.html overrides the theme's use of this - it puts the
# icon *beside* the wordmark rather than replacing it. Kept set because
# jekyll-seo-tag reads it for the site's structured data.
logo: /assets/img/flare-icon.svg

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor

defaults:
  - scope:
      path: ''
    values:
      layout: default
      # jekyll-seo-tag's og:image comes from the page, not the site,
      # so every page needs one for a link preview to show anything.
      image: /assets/img/flare-icon.png

aux_links:
  'GitHub': https://github.com/danrspencer/flare
aux_links_new_tab: true

# Page indexes list sections and sub-sections but stop there. kramdown
# ignores a per-TOC `levels` attribute - it only honours this global
# option - and without it the longer references index their h4s too,
# which makes the index as hard to scan as the page. 2..3 also matches
# what assets/js/section-nav.js puts in the sidebar, so the two agree.
kramdown:
  toc_levels: 2..3

plugins:
  - jekyll-seo-tag

heading_anchors: true
search_enabled: true

color_scheme: light
