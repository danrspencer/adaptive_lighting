title: Adaptive Lighting
description: Home Assistant lighting matched to the shape of your day — four named phases, override protection, and scene handoff.
url: https://danrspencer.github.io
baseurl: /adaptive_lighting

theme: just-the-docs

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor

defaults:
  - scope:
      path: ''
    values:
      layout: default

aux_links:
  'GitHub': https://github.com/danrspencer/adaptive_lighting
aux_links_new_tab: true

plugins:
  - jekyll-seo-tag

heading_anchors: true
search_enabled: true

color_scheme: light
