# Polls the adaptive_lighting repo for new commits and redeploys the
# blueprint/pyscript/dashboard files when it finds any - see
# scripts/sync_and_link.sh and CLAUDE.md. Copied (not symlinked) into
# /config/packages by scripts/link_into_ha.sh, same as the blueprint -
# see CLAUDE.md lesson 7 for why.
#
# New shell_command entries need a full HA restart to take effect, not
# just a YAML reload.

shell_command:
  adaptive_lighting_sync: "/config/repos/adaptive_lighting/scripts/sync_and_link.sh"

automation:
  - alias: "Adaptive Lighting: sync from git"
    id: adaptive_lighting_sync
    description: >
      Checks the adaptive_lighting repo for new commits every 15
      minutes and redeploys the blueprint/pyscript/dashboard files if
      there are any.
    trigger:
      - platform: time_pattern
        minutes: "/15"
    action:
      - action: shell_command.adaptive_lighting_sync
    mode: single
