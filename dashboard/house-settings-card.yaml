# Snippet to drop into a dashboard view (not auto-deployed - storage-mode
# dashboards aren't files, so this is just the card config to paste in).
#
# Requires:
#   1. Adaptive Lighting Helpers installed and set up - the card ships
#      inside the integration and self-registers with the frontend on
#      startup (see __init__.py's async_setup), no manual Lovelace
#      resource registration needed.
#   2. The sensors it reads to exist with these entity_ids and
#      attribute shapes (produced by the adaptive_lighting_helpers
#      integration's day-phase/curve sensors - see docs/HELPERS.md's
#      "Optional: day-phase/curve sensors" section). The defaults are
#      the auto-seeded "Default" sensor's entities; point the card at
#      any other sensor via the `entities` map shown below.
#        sensor.default_adaptive_lighting - state: Morning/Day/Evening/Night
#                                           attributes.brightness (0-255),
#                                           attributes.color_temp (Kelvin),
#                                           attributes.morning_start/day_start/
#                                           evening_start/night_start (unix
#                                           seconds), attributes.evening_earliest/
#                                           evening_latest (unix seconds,
#                                           optional - only used to explain
#                                           *why* evening starts when it does)
#        sensor.default_adaptive_lighting_curve - attributes.points: [{t, brightness, kelvin}, ...]
#        sun.sun (optional, same reason as evening's earliest/latest)

type: heading
heading: Adaptive Lighting Curve
heading_style: title
icon: mdi:chart-bell-curve
---
type: custom:adaptive-lighting-curve-card
# Uncomment to point at a differently-named sensor (the slugified name,
# i.e. "Living Room" -> living_room); defaults to the auto-seeded
# "Default" sensor. Individual entity_ids can still be overridden via
# an `entities` map if you're using a hand-written sensor instead.
# sensor: living_room
