# Snippet to drop into a dashboard view (not auto-deployed - storage-mode
# dashboards aren't files, so this is just the card config to paste in).
#
# Requires:
#   1. www/adaptive-lighting-curve-card.js registered as a dashboard
#      resource: Settings -> Dashboards -> Resources -> Add Resource
#        URL:  /local/adaptive-lighting-curve-card.js
#        Type: JavaScript Module
#   2. The sensors it reads to exist with these exact entity_ids and
#      attribute shapes (produced by the adaptive_lighting_helpers
#      integration's optional day-phase/curve sensors - see its README
#      "Optional: day-phase/curve sensors" section):
#        sensor.adaptive_lighting        - state: Morning/Day/Evening/Night
#                                           attributes.brightness (0-255),
#                                           attributes.color_temp (Kelvin),
#                                           attributes.morning_start/day_start/
#                                           evening_start/night_start (unix
#                                           seconds), attributes.evening_earliest/
#                                           evening_latest (unix seconds,
#                                           optional - only used to explain
#                                           *why* evening starts when it does)
#        sensor.adaptive_lighting_curve  - attributes.points: [{t, brightness, kelvin}, ...]
#        sun.sun (optional, same reason as evening's earliest/latest)

type: heading
heading: Adaptive Lighting Curve
heading_style: title
icon: mdi:chart-bell-curve
---
type: custom:adaptive-lighting-curve-card
