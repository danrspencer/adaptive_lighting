# Snippet to drop into a dashboard view (not auto-deployed - storage-mode
# dashboards aren't files, so this is just the card config to paste in).
#
# Requires:
#   1. Adaptive Lighting Helpers installed and set up - the card ships
#      inside the integration and self-registers with the frontend on
#      startup (see __init__.py's async_setup), no manual Lovelace
#      resource registration needed.
#   2. A sensor added (Settings -> Devices & Services -> Adaptive
#      Lighting Helpers -> Add Sensor - just a name) with these
#      entity_ids and attribute shapes (produced by the
#      adaptive_lighting_helpers integration's day-phase/curve sensors
#      - see docs/HELPERS.md's "Optional: day-phase/curve sensors"
#      section). Substitute your sensor's own slugified name for
#      "living_room" below (or point individual entity_ids at a
#      hand-written sensor instead via the `entities` map).
#        sensor.living_room_adaptive_lighting - state: Morning/Day/Evening/Night
#                                           attributes.brightness (0-255),
#                                           attributes.color_temp (Kelvin),
#                                           attributes.morning_start/day_start/
#                                           evening_start/night_start (unix
#                                           seconds), attributes.evening_earliest/
#                                           evening_latest (unix seconds,
#                                           optional - only used to explain
#                                           *why* evening starts when it does)
#        sensor.living_room_adaptive_lighting_curve - attributes.points: [{t, brightness, kelvin}, ...]
#        sun.sun (optional, same reason as evening's earliest/latest)
#
# For the curve graph plus the override and every config entity in one
# section, see adaptive-lighting-section.yaml instead.

type: heading
heading: Adaptive Lighting Curve
heading_style: title
icon: mdi:chart-bell-curve
---
type: custom:adaptive-lighting-curve-card
sensor: living_room
# Without this, the card renders at whatever its own natural width is
# (a fraction of the section) rather than the section's full width,
# even though the heading card above it does span full width by
# default - a real HA "sections" view quirk, not specific to this card.
grid_options:
  columns: full
