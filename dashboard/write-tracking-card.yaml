# Snippet to drop into a dashboard view (not auto-deployed - storage-mode
# dashboards aren't files, so this is just the card config to paste in).
#
# Requires only Adaptive Lighting Helpers installed and set up - the card
# ships inside the integration and self-registers with the frontend on
# startup (see __init__.py's async_setup), no manual Lovelace resource
# registration needed. Unlike the curve card, there's nothing to point it
# at: sensor.adaptive_lighting_write_tracking is a single, entry-scoped
# entity (see docs/HELPERS.md's "Inspecting write-tracking state"
# section) - it exists as soon as the integration does, with no "Add
# Sensor" step and no per-room config.

type: custom:adaptive-lighting-write-tracking-card
