<!doctype html>
<!--
  Standalone preview of the real Lovelace card, fed synthetic data
  (dashboard/preview_data.json, generated by generate_preview_data.py
  using the integration's actual curve.py) instead of a live Home
  Assistant instance. Serve the REPO ROOT over HTTP (fetch() needs
  that, file:// won't work - and it must be the repo root, not this
  directory, since this page imports
  ../custom_components/adaptive_lighting_helpers/www/), e.g.:

    python3 -m http.server 8934

  then visit http://localhost:8934/dashboard/preview.html
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Adaptive Lighting Curve — preview</title>
    <style>
      :root {
        --primary-text-color: #212121;
        --secondary-text-color: #6f6f6f;
        --divider-color: #e0e0e0;
        --card-background-color: #ffffff;
        --error-color: #db4437;
        --ha-card-box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #fafafa;
        margin: 0;
        padding: 32px;
      }
      #card-container {
        max-width: 820px;
        margin: 0 auto;
      }
    </style>
  </head>
  <body>
    <div id="card-container"></div>

    <script type="module">
      import '../custom_components/adaptive_lighting_helpers/www/adaptive-lighting-curve-card.js';
      import '../custom_components/adaptive_lighting_helpers/www/adaptive-lighting-write-tracking-card.js';

      // Minimal <ha-card> stand-in - the real one is part of HA's
      // frontend, not something this repo ships or should depend on.
      if (!customElements.get('ha-card')) {
        customElements.define(
          'ha-card',
          class extends HTMLElement {
            connectedCallback() {
              if (this._built) return;
              this._built = true;
              this.style.cssText = `
                display: block;
                background: var(--card-background-color);
                border-radius: 12px;
                box-shadow: var(--ha-card-box-shadow);
                overflow: hidden;
              `;
              const header = this.getAttribute('header');
              if (header) {
                const h = document.createElement('div');
                h.textContent = header;
                h.style.cssText =
                  'padding:16px 16px 0;font-size:1.2em;font-weight:500;color:var(--primary-text-color);';
                this.prepend(h);
              }
            }
          }
        );
      }

      const data = await fetch('preview_data.json').then((r) => r.json());

      const state = (value, attributes = {}) => ({ state: String(value), attributes });

      const states = {
        'sun.sun': state('above_horizon', {
          next_rising: new Date(data.sun.sunrise * 1000).toISOString(),
          next_setting: new Date(data.sun.sunset * 1000).toISOString(),
        }),
        // Combined entity: state = phase, attributes = brightness/color_temp/
        // morning_start/day_start/evening_start/night_start/
        // evening_earliest/evening_latest/points - matches sensor.py's
        // _AdaptiveLightingSensor shape, under the entity_ids a sensor
        // named "Default" would create (the card's DEFAULT_ENTITIES).
        'sensor.default_adaptive_lighting': state(data.now_phase, {
          phase: data.now_phase,
          brightness: data.now_brightness,
          color_temp: data.now_kelvin,
          morning_start: data.boundaries.morning,
          day_start: data.boundaries.day,
          evening_start: data.boundaries.evening,
          night_start: data.boundaries.night,
          evening_earliest: data.boundaries.evening_earliest,
          evening_latest: data.boundaries.evening_latest,
          points: data.points,
        }),
      };

      // Two cards to exercise both ends of the title config: no `title`
      // at all defaults to "Adaptive Lighting"; `title: ''` hides the
      // header entirely (for a dashboard that already labels the sensor
      // elsewhere, e.g. a heading card above it).
      const defaultTitleCard = document.createElement('adaptive-lighting-curve-card');
      defaultTitleCard.setConfig({});
      defaultTitleCard.hass = { states };
      document.getElementById('card-container').appendChild(defaultTitleCard);

      const noTitleCard = document.createElement('adaptive-lighting-curve-card');
      noTitleCard.setConfig({ title: '' });
      noTitleCard.hass = { states };
      const spacer = document.createElement('div');
      spacer.style.height = '24px';
      document.getElementById('card-container').appendChild(spacer);
      document.getElementById('card-container').appendChild(noTitleCard);

      // --- Write tracking card: synthetic data covering every status,
      // plus a mocked callWS so the "Trace" button has something to
      // resolve against without a real HA logbook.
      const now = new Date();
      const minutesAgo = (m) => new Date(now.getTime() - m * 60000).toISOString();

      const writeTrackingStates = {
        'sensor.adaptive_lighting_write_tracking': state(4, {
          entities: {
            'light.living_room_pendant_1': {
              status: 'controlled',
              owner_id: 'automation.living_room_lights_new',
              live_context_id: '01M0FGWR11K8K1KDE56JJRJ94C',
              confirmed: {
                context_id: '01M0FGWR11K8K1KDE56JJRJ94C',
                owner_id: 'automation.living_room_lights_new',
                recorded_at: minutesAgo(12),
                target: { brightness: 200, color_temp_kelvin: 4000 },
              },
              pending: null,
            },
            'light.kitchen_pendant_1': {
              status: 'pending',
              owner_id: 'automation.kitchen_lights',
              live_context_id: '01M0FTMHAJTQH94ZKP6DRSN2MK',
              confirmed: {
                context_id: '01M0FTHVWMJ0DRSNB5RT92ZXVC',
                owner_id: 'automation.kitchen_lights',
                recorded_at: minutesAgo(6),
                target: { brightness: 255, color_temp_kelvin: 5000 },
              },
              pending: {
                context_id: '01M0FTMHAJTQH94ZKP6DRSN2MK',
                owner_id: 'automation.kitchen_lights',
                recorded_at: minutesAgo(1),
                target: { brightness: 255, color_temp_kelvin: 4800 },
              },
            },
            'light.kitchen_3': {
              // Controlled via the value-match rescue, not a context
              // match - the device's own delayed confirmation landed
              // under an unrelated context (HA's Entity._context expires
              // 5s after the service call that set it), but still
              // reports exactly what pending asked for. See
              // grouping.py's externally_set() docstring.
              status: 'controlled',
              owner_id: 'automation.kitchen_lights',
              live_context_id: '01M0DEVICEECHO000000001',
              confirmed: {
                context_id: '01M0EARLIERCONFIRMED00001',
                owner_id: 'automation.kitchen_lights',
                recorded_at: minutesAgo(75),
                target: { brightness: 255, color_temp_kelvin: 6535 },
              },
              pending: {
                context_id: '01M0LATERPENDING0000001',
                owner_id: 'automation.kitchen_lights',
                recorded_at: minutesAgo(64),
                target: { brightness: 255, color_temp_kelvin: 6535 },
              },
            },
            'light.study_pendant': {
              status: 'overridden',
              owner_id: null,
              live_context_id: '01M0EXTERNALCHANGE0000001',
              confirmed: {
                context_id: '01M0F1953BZB75V27GJNXH3ABW',
                owner_id: 'automation.study_lights',
                recorded_at: minutesAgo(90),
                target: { brightness: 180, color_temp_kelvin: 3200 },
              },
              pending: null,
            },
            'light.ensuite_spots': {
              status: 'unavailable',
              owner_id: null,
              live_context_id: null,
              confirmed: {
                context_id: '01M00S8AVPV6BDQEJ22A04R3NM',
                owner_id: 'automation.ensuite_lights',
                recorded_at: minutesAgo(240),
                target: { brightness: 200, color_temp_kelvin: 2700 },
              },
              pending: null,
            },
            'light.dining_room_1': {
              // Legitimately off - turned off by the blueprint's own
              // motion_off action, a code path outside apply_lighting
              // whose context write_tracking.py never records. Override
              // protection is entirely moot for a light that isn't on -
              // see override_protection.classify()'s own "off" case.
              status: 'off',
              owner_id: null,
              live_context_id: '01M0MOTIONOFF00000000001',
              confirmed: {
                context_id: '01M0FGWR22K8K1KDE56JJRJ95D',
                owner_id: 'automation.dining_room_lighting',
                recorded_at: minutesAgo(18),
                target: { brightness: 255, color_temp_kelvin: 6153 },
              },
              pending: {
                context_id: '01M0FGWR33K8K1KDE56JJRJ96E',
                owner_id: 'automation.dining_room_lighting',
                recorded_at: minutesAgo(13),
                target: { brightness: 255, color_temp_kelvin: 6134 },
              },
            },
          },
        }),
      };

      const writeTrackingCard = document.createElement('adaptive-lighting-write-tracking-card');
      writeTrackingCard.setConfig({});
      writeTrackingCard.hass = {
        states: writeTrackingStates,
        // Mocked logbook resolution - the real one is a WebSocket round
        // trip to HA core (see logbook/get_events in the card's own
        // header comment); this just returns a plausible-looking entry
        // after a short delay so the loading state is also visible.
        callWS: (msg) =>
          new Promise((resolve) => {
            setTimeout(() => {
              if (msg.type !== 'logbook/get_events') {
                resolve([]);
                return;
              }
              resolve([
                {
                  name: 'Kitchen Pendant 1',
                  message: 'turned on',
                  entity_id: 'light.kitchen_pendant_1',
                  domain: 'light',
                  when: Date.now() / 1000,
                  context_id: msg.context_id,
                },
              ]);
            }, 400);
          }),
        // Mocked clear_ownership - the real service call round-trips to
        // write_tracking.py's async_clear (see the card's own _clear()
        // method); this just deletes the entity from the synthetic
        // entities object and pushes a fresh state, matching how the
        // real sensor pushes via SIGNAL_WRITE_TRACKING_UPDATED after a
        // real clear.
        callService: (domain, service, data) =>
          new Promise((resolve) => {
            setTimeout(() => {
              if (domain === 'adaptive_lighting_helpers' && service === 'clear_ownership') {
                for (const entityId of data.entities || []) {
                  delete writeTrackingStates['sensor.adaptive_lighting_write_tracking'].attributes.entities[entityId];
                }
                writeTrackingCard.hass = { ...writeTrackingCard._hass, states: { ...writeTrackingStates } };
              }
              resolve();
            }, 500);
          }),
      };
      const wtSpacer = document.createElement('div');
      wtSpacer.style.height = '24px';
      document.getElementById('card-container').appendChild(wtSpacer);
      document.getElementById('card-container').appendChild(writeTrackingCard);
    </script>
  </body>
</html>
