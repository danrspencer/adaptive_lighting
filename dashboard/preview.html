<!doctype html>
<!--
  Standalone preview of the real Lovelace card, fed synthetic data
  (dashboard/preview_data.json, generated by generate_preview_data.py
  using the actual pyscript curve module) instead of a live Home
  Assistant instance. Serve this directory over HTTP (fetch() needs
  that, file:// won't work) and open preview.html, e.g.:

    python3 -m http.server -d dashboard 8123

  then visit http://localhost:8123/preview.html
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Adaptive Lighting Curve — preview</title>
    <style>
      :root {
        --primary-text-color: #212121;
        --secondary-text-color: #6f6f6f;
        --divider-color: #e0e0e0;
        --card-background-color: #ffffff;
        --error-color: #db4437;
        --ha-card-box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #fafafa;
        margin: 0;
        padding: 32px;
      }
      #card-container {
        max-width: 820px;
        margin: 0 auto;
      }
    </style>
  </head>
  <body>
    <div id="card-container"></div>

    <script type="module">
      import '../www/adaptive-lighting-curve-card.js';

      // Minimal <ha-card> stand-in - the real one is part of HA's
      // frontend, not something this repo ships or should depend on.
      if (!customElements.get('ha-card')) {
        customElements.define(
          'ha-card',
          class extends HTMLElement {
            connectedCallback() {
              if (this._built) return;
              this._built = true;
              this.style.cssText = `
                display: block;
                background: var(--card-background-color);
                border-radius: 12px;
                box-shadow: var(--ha-card-box-shadow);
                overflow: hidden;
              `;
              const header = this.getAttribute('header');
              if (header) {
                const h = document.createElement('div');
                h.textContent = header;
                h.style.cssText =
                  'padding:16px 16px 0;font-size:1.2em;font-weight:500;color:var(--primary-text-color);';
                this.prepend(h);
              }
            }
          }
        );
      }

      const data = await fetch('preview_data.json').then((r) => r.json());

      const state = (value, attributes = {}) => ({ state: String(value), attributes });

      const states = {
        'sun.sun': state('above_horizon', {
          next_rising: new Date(data.sun.sunrise * 1000).toISOString(),
          next_setting: new Date(data.sun.sunset * 1000).toISOString(),
        }),
        'sensor.adaptive_lighting_curve': state(new Date().toISOString(), { points: data.points }),
        // Combined entity: state = phase, attributes = brightness/color_temp/
        // rgb_color/morning_start/day_start/evening_start/night_start/
        // evening_earliest/evening_latest - matches sensor.py's
        // _AdaptiveLightingSensor shape (the four boundary sensors this
        // used to read separately were folded into attributes here).
        // now_rgb_color is generated with NIGHT_FLOOR_KELVIN below 2700
        // (see generate_preview_data.py) specifically so this preview
        // demonstrates the card's RGB overlay, not just its absence.
        'sensor.adaptive_lighting': state(data.now_phase, {
          phase: data.now_phase,
          brightness: data.now_brightness,
          color_temp: data.now_kelvin,
          rgb_color: data.now_rgb_color,
          morning_start: data.boundaries.morning,
          day_start: data.boundaries.day,
          evening_start: data.boundaries.evening,
          night_start: data.boundaries.night,
          evening_earliest: data.boundaries.evening_earliest,
          evening_latest: data.boundaries.evening_latest,
        }),
      };

      const card = document.createElement('adaptive-lighting-curve-card');
      card.setConfig({ title: 'Adaptive Lighting Curve' });
      card.hass = { states };
      document.getElementById('card-container').appendChild(card);
    </script>
  </body>
</html>
