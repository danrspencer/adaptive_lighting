<!doctype html>
<!--
  Standalone preview of the real Lovelace card, fed synthetic data
  (dashboard/preview_data.json, generated by generate_preview_data.py
  using the integration's actual curve.py) instead of a live Home
  Assistant instance. Serve the REPO ROOT over HTTP (fetch() needs
  that, file:// won't work - and it must be the repo root, not this
  directory, since this page imports
  ../custom_components/adaptive_lighting_helpers/www/), e.g.:

    python3 -m http.server 8934

  then visit http://localhost:8934/dashboard/preview.html
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Adaptive Lighting Curve — preview</title>
    <style>
      :root {
        --primary-text-color: #212121;
        --secondary-text-color: #6f6f6f;
        --divider-color: #e0e0e0;
        --card-background-color: #ffffff;
        --error-color: #db4437;
        --ha-card-box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #fafafa;
        margin: 0;
        padding: 32px;
      }
      #card-container {
        max-width: 820px;
        margin: 0 auto;
      }
    </style>
  </head>
  <body>
    <div id="card-container"></div>

    <script type="module">
      import '../custom_components/adaptive_lighting_helpers/www/adaptive-lighting-curve-card.js';

      // Minimal <ha-card> stand-in - the real one is part of HA's
      // frontend, not something this repo ships or should depend on.
      if (!customElements.get('ha-card')) {
        customElements.define(
          'ha-card',
          class extends HTMLElement {
            connectedCallback() {
              if (this._built) return;
              this._built = true;
              this.style.cssText = `
                display: block;
                background: var(--card-background-color);
                border-radius: 12px;
                box-shadow: var(--ha-card-box-shadow);
                overflow: hidden;
              `;
              const header = this.getAttribute('header');
              if (header) {
                const h = document.createElement('div');
                h.textContent = header;
                h.style.cssText =
                  'padding:16px 16px 0;font-size:1.2em;font-weight:500;color:var(--primary-text-color);';
                this.prepend(h);
              }
            }
          }
        );
      }

      const data = await fetch('preview_data.json').then((r) => r.json());

      const state = (value, attributes = {}) => ({ state: String(value), attributes });

      const states = {
        'sun.sun': state('above_horizon', {
          next_rising: new Date(data.sun.sunrise * 1000).toISOString(),
          next_setting: new Date(data.sun.sunset * 1000).toISOString(),
        }),
        // Combined entity: state = phase, attributes = brightness/color_temp/
        // morning_start/day_start/evening_start/night_start/
        // evening_earliest/evening_latest/points - matches sensor.py's
        // _AdaptiveLightingSensor shape, under the entity_ids a sensor
        // named "Default" would create (the card's DEFAULT_ENTITIES).
        'sensor.default_adaptive_lighting': state(data.now_phase, {
          phase: data.now_phase,
          brightness: data.now_brightness,
          color_temp: data.now_kelvin,
          morning_start: data.boundaries.morning,
          day_start: data.boundaries.day,
          evening_start: data.boundaries.evening,
          night_start: data.boundaries.night,
          evening_earliest: data.boundaries.evening_earliest,
          evening_latest: data.boundaries.evening_latest,
          points: data.points,
        }),
      };

      // Two cards to exercise both ends of the title config: no `title`
      // at all defaults to "Adaptive Lighting"; `title: ''` hides the
      // header entirely (for a dashboard that already labels the sensor
      // elsewhere, e.g. a heading card above it).
      const defaultTitleCard = document.createElement('adaptive-lighting-curve-card');
      defaultTitleCard.setConfig({});
      defaultTitleCard.hass = { states };
      document.getElementById('card-container').appendChild(defaultTitleCard);

      const noTitleCard = document.createElement('adaptive-lighting-curve-card');
      noTitleCard.setConfig({ title: '' });
      noTitleCard.hass = { states };
      const spacer = document.createElement('div');
      spacer.style.height = '24px';
      document.getElementById('card-container').appendChild(spacer);
      document.getElementById('card-container').appendChild(noTitleCard);
    </script>
  </body>
</html>
