# A complete dashboard section for one Adaptive Lighting Helpers
# sensor: the curve graph, the phase override + sticky-override switch,
# and every schedule/curve config entity - everything that lives on
# that sensor's device (see docs/HELPERS.md), laid out for a dashboard
# instead of only reachable via Settings -> Devices.
#
# Not auto-deployed - storage-mode dashboards aren't files, so this is
# just the section config to paste in, the same way
# house-settings-card.yaml is (that file is the curve graph alone;
# this is the fuller version with the config entities too - use
# whichever fits, they're not meant to be combined on the same view).
#
# Requires:
#   1. Adaptive Lighting Helpers installed - the curve card ships
#      inside the integration and self-registers with the frontend on
#      startup, no manual Lovelace resource needed.
#   2. A sensor added (Settings -> Devices & Services -> Adaptive
#      Lighting Helpers -> Add Sensor) - a name, nothing else.
#
# This is a template, not a fixed config: every `living_room` below is
# a placeholder for your sensor's own slug (the name you gave it,
# slugified - "Ground Floor" -> ground_floor). Every entity_id here
# shares that one prefix, so a find-and-replace of `living_room` is
# the only edit needed - see coordinator.py's schedule_instances() for
# where that prefix comes from.
#
# To use: open the dashboard in the UI -> Edit Dashboard -> Add Section
# -> the section's "..." menu -> Edit in YAML -> paste everything
# below `cards:` in as that section's cards list.

cards:
  - type: heading
    heading: Living Room
    heading_style: title
    icon: mdi:chart-bell-curve
    badges:
      - type: entity
        entity: select.living_room_adaptive_lighting_phase
        show_state: true
        show_icon: true

  - type: custom:adaptive-lighting-curve-card
    sensor: living_room

  - type: heading
    heading: Override
    heading_style: subtitle

  - type: grid
    columns: 2
    square: false
    cards:
      - type: tile
        entity: select.living_room_adaptive_lighting_phase
        name: Phase
      - type: tile
        entity: switch.living_room_sticky_phase_override
        name: Sticky

  - type: heading
    heading: Schedule
    heading_style: subtitle

  - type: grid
    columns: 3
    square: false
    cards:
      - type: tile
        entity: time.living_room_morning_time
        name: Morning
      - type: tile
        entity: time.living_room_day_time
        name: Day
      - type: tile
        entity: time.living_room_evening_earliest_time
        name: Evening (earliest)
      - type: tile
        entity: time.living_room_evening_latest_time
        name: Evening (latest)
      - type: tile
        entity: time.living_room_night_time
        name: Night

  - type: heading
    heading: Curve
    heading_style: subtitle

  - type: grid
    columns: 2
    square: false
    cards:
      - type: tile
        entity: number.living_room_morning_brightness
        name: Morning brightness
      - type: tile
        entity: number.living_room_morning_kelvin
        name: Morning colour temp
      - type: tile
        entity: number.living_room_day_brightness
        name: Day brightness
      - type: tile
        entity: number.living_room_day_end_kelvin
        name: Day end colour temp
      - type: tile
        entity: number.living_room_evening_brightness
        name: Evening brightness
      - type: tile
        entity: number.living_room_evening_kelvin
        name: Evening colour temp
      - type: tile
        entity: number.living_room_night_brightness
        name: Night brightness
      - type: tile
        entity: number.living_room_night_kelvin
        name: Night colour temp
